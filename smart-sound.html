<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>Smart-Sound</title>
<script src="./url.js"></script>
<script>
// ==========================================================
// CONFIGURACIÓN
// ==========================================================
const API = URLS.sound;
const KN_AUTH_API = URLS.account;
const AUTH_URL = URLS.auth;
const TOKEN_KEY = "smart_token";
const PAGE_SIZE = 50;
const SEARCH_DELAY_MS = 300;
const AUDIO_EXTENSIONS = [".mp3", ".wav", ".ogg", ".opus", ".flac", ".m4a", ".aac", ".webm"];
const DEFAULT_MAX_TRACK_BYTES = 200 * 1024 * 1024;
const COVER_EXTENSIONS = [".jpg", ".jpeg", ".png", ".webp"];
const MAX_COVER_BYTES = 5 * 1024 * 1024;
const VOLUME_KEY = "smartsound_volume";
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --sidebar: #121820;
  --surface: #171f29;
  --surface-2: #1d2733;
  --surface-hover: #222f3c;
  --border: #2b3947;
  --text: #f0f5f9;
  --muted: #93a2b2;
  --faint: #657586;
  --accent: #34dce8;
  --accent-strong: #13bdca;
  --danger: #ff6675;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
button { border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: not-allowed; }
.app { display: grid; grid-template-columns: 238px minmax(0,1fr); grid-template-rows: minmax(0,1fr) 94px; width: 100%; height: 100vh; height: 100dvh; min-height: 0; background: var(--bg); }
/* Sidebar */
.panel { grid-column: 1; grid-row: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 24px 14px 15px; background: linear-gradient(180deg,#141c26 0%,#111720 100%); border-right: 1px solid var(--border); overflow: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 24px; }
.brand-icon { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 13px; color: #071419; font-size: 26px; font-weight: 900; background: linear-gradient(145deg,#7af3f7,#20bdcb); box-shadow: 0 7px 22px #19c1ce22; }
.brand-name { font-size: 16px; font-weight: 800; letter-spacing: -.035em; }
.brand-caption { margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .16em; }
.sidebar-label { padding: 11px 10px 8px; color: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: .15em; }
.side-nav { display: grid; gap: 5px; }
.nav-item { display: flex; align-items: center; gap: 11px; min-height: 42px; width: 100%; padding: 0 11px; border-radius: 9px; color: #aab8c6; background: transparent; text-align: left; font-size: 13px; font-weight: 600; }
.nav-item .nav-icon { width: 20px; text-align: center; font-size: 17px; }
.nav-item.active { color: var(--accent); background: #34dce815; }
.nav-item:hover:not(.active) { color: var(--text); background: #ffffff08; }
.sidebar-spacer { flex: 1; min-height: 22px; }
.me-box { display: flex; align-items: center; gap: 10px; padding: 12px 9px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 16px 0 12px; min-width: 0; }
.me-box img { width: 38px; height: 38px; border: 1px solid #42515f; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
.me-copy { min-width: 0; flex: 1; }
.me-label { color: var(--faint); font-size: 10px; margin-bottom: 3px; }
.me-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
.primary-btn, .side-btn, .secondary-btn, .danger-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; border-radius: 9px; padding: 10px 13px; font-weight: 750; font-size: 12px; transition: background .15s ease, transform .15s ease; }
.primary-btn { color: #071419; background: var(--accent); }
.primary-btn:hover:not(:disabled) { background: #69edf3; transform: translateY(-1px); }
.side-btn, .secondary-btn { color: var(--text); background: #26313d; border: 1px solid #344250; }
.side-btn:hover, .secondary-btn:hover { background: #303d4a; }
.danger-btn { color: white; background: #a93343; }
.danger-btn:hover { background: #c34252; }
.full { width: 100%; }
.logout-btn { justify-content: flex-start; margin-top: 5px; background: transparent; border-color: transparent; color: var(--muted); }
.logout-btn:hover { color: var(--text); background: #ffffff08; }
/* Main */
.center { grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(ellipse at 72% -20%,#1b3440 0,transparent 38%), var(--bg); }
.content-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 30px 34px 19px; flex: none; }
.eyebrow { margin-bottom: 8px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .18em; }
.content-heading h1 { color: var(--text); font-size: clamp(27px,3vw,37px); line-height: 1.08; letter-spacing: -.055em; font-weight: 800; }
.content-heading p { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.heading-mark { color: #34dce833; font-size: 60px; line-height: 1; padding-right: 8px; user-select: none; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 0 34px 17px; flex: none; }
.search-wrap { position: relative; flex: 1; min-width: 100px; }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search { width: 100%; height: 42px; padding: 0 14px 0 38px; border: 1px solid #2c3a47; border-radius: 10px; background: #121a23; color: var(--text); outline: none; font-size: 12px; }
.search:focus, select:focus { border-color: #34dce88a; }
select { height: 42px; max-width: 175px; padding: 0 12px; border: 1px solid #2c3a47; border-radius: 10px; background: #121a23; color: #d9e4eb; outline: none; font-size: 12px; }
.order-btn { width: 42px; height: 42px; flex: none; border: 1px solid #2c3a47; border-radius: 10px; background: #121a23; color: var(--muted); }
.order-btn:hover { color: var(--accent); border-color: #34dce866; }
.count { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; }
.list-area { min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 0 25px 18px; overflow: hidden; }
.table-head { display: grid; grid-template-columns: 38px minmax(170px,1.7fr) minmax(110px,1fr) minmax(85px,.75fr) 78px 116px; align-items: center; gap: 12px; padding: 0 13px 10px; border-bottom: 1px solid var(--border); color: var(--faint); font-size: 9px; font-weight: 800; letter-spacing: .13em; flex: none; }
.list { min-height: 0; flex: 1; overflow: auto; padding: 8px 0 14px; scrollbar-width: thin; scrollbar-color: #344553 transparent; }
.list::-webkit-scrollbar, .panel::-webkit-scrollbar, .modal-card::-webkit-scrollbar { width: 7px; }
.list::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb, .modal-card::-webkit-scrollbar-thumb { background: #344553; border-radius: 20px; }
.row { display: grid; grid-template-columns: 38px minmax(170px,1.7fr) minmax(110px,1fr) minmax(85px,.75fr) 78px 116px; align-items: center; gap: 12px; min-height: 66px; padding: 8px 13px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; transition: background .14s ease, border-color .14s ease; }
.row:hover { background: #ffffff06; }
.row.playing { background: #34dce80c; border-color: #34dce82e; }
.track-index { display: grid; place-items: center; color: #738395; font-size: 11px; font-variant-numeric: tabular-nums; }
.row.playing .track-index { color: var(--accent); }
.track-main { display: flex; align-items: center; min-width: 0; gap: 11px; }
.track-art { display: grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 8px; color: #83eaf0; background: linear-gradient(145deg,#243d4a,#17242f); font-size: 19px; }
.track-main-copy { min-width: 0; }
.row-title { overflow: hidden; color: #eaf1f6; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.row-album, .row-genre { min-width: 0; overflow: hidden; color: #a7b4c1; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
.row-size { text-align: right; color: #7f8e9e; font-size: 10px; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: #a5b4c2; background: transparent; font-size: 13px; }
.icon-btn:hover { color: var(--accent); background: #34dce817; }
.icon-btn.del:hover { color: #ffb6be; background: #ff66751a; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 230px; padding: 30px 15px; color: var(--muted); text-align: center; line-height: 1.7; font-size: 13px; }
.empty::before { content: "♫"; display: grid; place-items: center; width: 62px; height: 62px; margin-bottom: 15px; border-radius: 18px; color: var(--accent); background: #34dce812; font-size: 29px; }
.more-btn { display: block; margin: 12px auto 0; padding: 10px 18px; border: 1px solid #344553; border-radius: 9px; color: var(--text); background: var(--surface); font-size: 12px; font-weight: 700; }
.more-btn:hover { border-color: #34dce866; color: var(--accent); }
/* Player dock */
.player { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(170px,1fr) minmax(250px,1.2fr) minmax(130px,1fr); align-items: center; gap: 20px; min-width: 0; padding: 12px 24px; border-top: 1px solid #2b3947; background: #10161e; box-shadow: 0 -8px 28px #00000016; }
.now { display: flex; align-items: center; min-width: 0; gap: 11px; }
.cover { display: grid; place-items: center; flex: none; width: 54px; height: 54px; overflow: hidden; border: 1px solid #354553; border-radius: 10px; color: var(--accent); background: linear-gradient(145deg,#233845,#17212b); font-size: 23px; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.now-text { min-width: 0; }
.now-title { overflow: hidden; color: #edf4f8; font-size: 12px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
.now-sub { overflow: hidden; margin-top: 5px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.transport { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctl { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #a5b4c2; background: transparent; font-size: 14px; }
.ctl:hover:not(:disabled) { color: var(--text); background: #26323e; }
.ctl.on { color: var(--accent); }
.ctl.play { width: 39px; height: 39px; color: #071419; background: var(--accent); font-size: 17px; }
.ctl.play:hover { background: #72edf3; }
.seek { display: flex; align-items: center; gap: 9px; color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
.seek span { width: 34px; flex: none; text-align: center; }
input[type=range] { min-width: 0; flex: 1; accent-color: var(--accent); cursor: pointer; }
.volume { display: flex; align-items: center; justify-content: flex-end; gap: 9px; color: #7f8e9e; font-size: 14px; }
.volume input { max-width: 112px; }
/* Modals */
.modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: #05080dc9; backdrop-filter: blur(7px); }
.modal.show { display: flex; }
.modal-card { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; padding: 23px; border: 1px solid #33414f; border-radius: 17px; background: #151e28; box-shadow: 0 24px 90px #0008; }
.modal-card.small { max-width: 410px; }
.modal .title { margin-bottom: 17px; color: var(--text); font-size: 19px; font-weight: 800; letter-spacing: -.03em; }
.dlg-text { margin-bottom: 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.dlg-text:empty { display: none; }
.field { margin-bottom: 13px; }
.field label { display: block; margin-bottom: 6px; color: #a7b4c1; font-size: 11px; font-weight: 700; }
.field input[type=text], .field textarea { width: 100%; min-height: 40px; padding: 10px 12px; border: 1px solid #344453; border-radius: 9px; color: var(--text); background: #0f161e; outline: none; font-size: 12px; }
.field input[type=file] { width: 100%; color: var(--muted); font-size: 12px; }
.field input[type=text]:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 74px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cover-row { display: flex; align-items: center; gap: 12px; }
.cover-preview { display: grid; place-items: center; width: 60px; height: 60px; flex: none; overflow: hidden; border-radius: 9px; background: #24313d; color: var(--muted); font-size: 21px; }
.cover-preview img { width: 100%; height: 100%; object-fit: cover; }
.status-box { display: none; margin-bottom: 13px; padding: 10px 12px; border-radius: 9px; font-size: 12px; line-height: 1.5; }
.status-box.show { display: block; }
.status-box.err { color: #ffb8c0; background: #48232a; border: 1px solid #713944; }
.status-box.info { color: #baf5f7; background: #19323a; border: 1px solid #28525c; }
.progress { display: none; margin-bottom: 13px; }
.progress.show { display: block; }
.progress .bar { height: 7px; border-radius: 99px; overflow: hidden; background: #273541; }
.progress .bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .15s; }
.progress-text { margin-top: 7px; color: var(--muted); font-size: 11px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 17px; }
.modal-actions button { flex: 1; min-width: 110px; }
.toast { position: fixed; left: 50%; bottom: 112px; z-index: 50; max-width: 90vw; padding: 11px 16px; transform: translateX(-50%); border: 1px solid #344553; border-radius: 11px; color: var(--text); background: #18222d; box-shadow: 0 12px 32px #0005; display: none; font-size: 12px; }
.toast.show { display: block; }
@media (max-width: 1050px) {
  .app { grid-template-columns: 205px minmax(0,1fr); }
  .content-top { padding: 24px 24px 16px; }
  .toolbar { padding: 0 24px 15px; }
  .list-area { padding: 0 16px 12px; }
  .table-head, .row { grid-template-columns: 30px minmax(150px,1.6fr) minmax(85px,1fr) 68px 105px; gap: 9px; }
  .th-genre, .row-genre { display: none; }
  .player { gap: 12px; padding: 10px 16px; }
}
@media (max-width: 760px) {
  html, body { overflow: hidden; }
  .app { grid-template-columns: 1fr; grid-template-rows: 58px minmax(0,1fr) 116px; }
  .panel { grid-column: 1; grid-row: 1; flex-direction: row; align-items: center; gap: 10px; padding: 7px 12px; border-right: 0; border-bottom: 1px solid var(--border); overflow: hidden; }
  .brand { gap: 8px; padding: 0; }
  .brand-icon { width: 36px; height: 36px; border-radius: 10px; font-size: 21px; }
  .brand-name { font-size: 13px; }
  .brand-caption, .sidebar-label, .side-nav, .sidebar-spacer { display: none; }
  .me-box { margin: 0 0 0 auto; padding: 0 9px 0 0; border: 0; }
  .me-box img { width: 31px; height: 31px; }
  .me-label { display: none; }
  .primary-btn { min-height: 35px; padding: 8px 11px; white-space: nowrap; }
  .panel > .primary-btn { width: auto; }
  .logout-btn { width: 37px; min-width: 37px; min-height: 35px; padding: 0; justify-content: center; margin: 0; }
  .logout-label { display: none; }
  .center { grid-column: 1; grid-row: 2; }
  .content-top { padding: 17px 18px 12px; }
  .content-heading h1 { font-size: 26px; }
  .content-heading p { font-size: 11px; }
  .heading-mark { font-size: 40px; }
  .toolbar { padding: 0 14px 12px; gap: 7px; }
  .search { height: 38px; font-size: 11px; }
  select { max-width: 112px; height: 38px; font-size: 11px; }
  .order-btn { width: 38px; height: 38px; }
  .count { display: none; }
  .list-area { padding: 0 10px 8px; }
  .table-head { grid-template-columns: 25px minmax(130px,1fr) 72px; padding: 0 9px 8px; gap: 8px; }
  .table-head .th-album, .table-head .th-size, .table-head .th-actions { display: none; }
  .row { grid-template-columns: 25px minmax(130px,1fr) 72px; gap: 8px; padding: 7px 9px; min-height: 58px; }
  .row-album, .row-size, .row-actions { display: none; }
  .track-art { width: 36px; height: 36px; }
  .player { grid-column: 1; grid-row: 3; grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto auto; gap: 4px 12px; padding: 8px 12px; }
  .cover { width: 39px; height: 39px; border-radius: 8px; }
  .now { grid-column: 1; grid-row: 1; gap: 8px; }
  .now-title { font-size: 11px; }
  .now-sub { font-size: 10px; }
  .transport { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: 1fr; gap: 2px; }
  .controls { position: absolute; right: 10px; top: 9px; gap: 2px; }
  .player { position: relative; }
  .controls .ctl { width: 28px; height: 28px; font-size: 12px; }
  .controls .ctl.play { width: 33px; height: 33px; font-size: 15px; }
  .seek { gap: 5px; }
  .seek span { width: 30px; font-size: 9px; }
  .volume { display: none; }
  .toast { bottom: 128px; }
}
@media (max-width: 430px) {
  .brand-copy { display: none; }
  .me-name { max-width: 82px; }
  .content-top { padding: 14px 13px 10px; }
  .heading-mark { display: none; }
  .toolbar { padding: 0 10px 10px; }
  select { max-width: 92px; padding: 0 6px; }
  .table-head, .row { grid-template-columns: 20px minmax(0,1fr) 56px; gap: 6px; }
  .track-art { width: 32px; height: 32px; }
  .row-genre, .th-genre { display: none; }
  .track-index { font-size: 10px; }
  .modal-card { padding: 16px; }
  .two { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>
<body>
<div class="app" id="app" style="display:none;">
  <aside class="panel" aria-label="Navegación de Smart-Sound">
    <div class="brand" aria-label="Smart-Sound">
      <div class="brand-icon" aria-hidden="true">♫</div>
      <div class="brand-copy">
        <div class="brand-name">Smart-Sound</div>
        <div class="brand-caption">MUSIC PLAYER</div>
      </div>
    </div>

    <div class="sidebar-label">ESCUCHA</div>
    <nav class="side-nav" aria-label="Secciones">
      <button class="nav-item active" type="button" id="navSongs">
        <span class="nav-icon" aria-hidden="true">♫</span>
        <span>Canciones</span>
      </button>
      <button class="nav-item" type="button" id="navRecent">
        <span class="nav-icon" aria-hidden="true">◷</span>
        <span>Añadidas recientemente</span>
      </button>
    </nav>

    <div class="sidebar-label">TU CUENTA</div>
    <button id="uploadBtn" class="primary-btn full" type="button">
      <span aria-hidden="true">＋</span> Subir canción
    </button>

    <div class="sidebar-spacer"></div>

    <div class="me-box">
      <img id="mypfp" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Crect width='50' height='50' rx='25' fill='%2326313d'/%3E%3Ccircle cx='25' cy='18' r='9' fill='%237f91a2'/%3E%3Cpath d='M8 47c1-10 7-16 17-16s16 6 17 16' fill='%237f91a2'/%3E%3C/svg%3E" alt="Foto de perfil">
      <div class="me-copy">
        <div class="me-label">SESIÓN ACTIVA</div>
        <div id="me" class="me-name">Cargando...</div>
      </div>
    </div>
    <button class="side-btn full logout-btn" type="button" onclick="logout()" title="Cerrar sesión">
      <span class="nav-icon" aria-hidden="true">↪</span>
      <span class="logout-label">Cerrar sesión</span>
    </button>
  </aside>

  <main class="center" id="center">
    <header class="content-top">
      <div class="content-heading">
        <div class="eyebrow">TU COLECCIÓN PERSONAL</div>
        <h1 id="viewTitle">Canciones</h1>
        <p id="viewDescription">Tu música, organizada en un solo lugar.</p>
      </div>
      <div class="heading-mark" aria-hidden="true">♫</div>
    </header>

    <div class="toolbar">
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Buscar canción, artista o álbum..." autocomplete="off" aria-label="Buscar canciones">
      </label>
      <select id="sort" title="Ordenar por" aria-label="Ordenar canciones">
        <option value="created">Recientes</option>
        <option value="title" selected>Título</option>
        <option value="artist">Artista</option>
        <option value="album">Álbum</option>
        <option value="size">Tamaño</option>
        <option value="updated">Modificadas</option>
      </select>
      <button id="orderBtn" class="order-btn" type="button" title="Cambiar orden" aria-label="Cambiar orden">▼</button>
      <div id="count" class="count" aria-live="polite"></div>
    </div>

    <section class="list-area" aria-label="Lista de canciones">

<script>

/* ============================================================
   ESTADO
============================================================ */

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";

let ME = null;

let tracks = [];          // canciones cargadas (la lista actual)
let total = 0;            // total que existe con el filtro actual
let query = "";
let sortBy = "title";
let sortOrder = "asc";
let loadingList = false;

let currentTrack = null;  // canción en el reproductor
let playToken = 0;        // evita mezclar respuestas de clics rápidos
let retriedTicket = false;
let shuffle = false;
let repeat = "off";       // off | all | one
let seeking = false;

let maxTrackBytes = DEFAULT_MAX_TRACK_BYTES;
let uploadXhr = null;
let editingTrack = null;

let searchTimer = null;
let toastTimer = null;
let redirecting = false;

const $ = id => document.getElementById(id);

const audio = $("audio");


/* ============================================================
   UTILIDADES
============================================================ */

function pfpUrl(value){

  if(!value){
    return "https://via.placeholder.com/52";
  }

  if(value.startsWith("http://") || value.startsWith("https://")){
    return value;
  }

  return KN_AUTH_API + (value.startsWith("/") ? value : "/" + value);
}


function showToast(message){

  const box = $("toast");

  box.textContent = message || "Ocurrió un error.";
  box.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 3200);
}


function formatBytes(bytes){

  if(!bytes){
    return "0 B";
  }

  const units = ["B", "KB", "MB", "GB", "TB"];

  let i = 0;
  let value = bytes;

  while(value >= 1024 && i < units.length - 1){
    value /= 1024;
    i++;
  }

  return (value >= 100 || i === 0 ? Math.round(value) : value.toFixed(1)) + " " + units[i];
}


function formatTime(seconds){

  if(!isFinite(seconds) || seconds < 0){
    return "0:00";
  }

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return m + ":" + String(s).padStart(2, "0");
}


function formatDate(unix){

  if(!unix){
    return "";
  }

  return new Date(unix * 1000).toLocaleDateString("es");
}


function extOf(name){

  const i = name.lastIndexOf(".");

  return i >= 0 ? name.slice(i).toLowerCase() : "";
}


/* ============================================================
   SESIÓN
============================================================ */

function goAuth(){

  if(redirecting){
    return;
  }

  redirecting = true;

  window.location.replace(
    AUTH_URL +
    "?redirect=" +
    encodeURIComponent(window.location.href)
  );
}


function sessionExpired(){

  localStorage.removeItem(TOKEN_KEY);

  TOKEN = "";

  goAuth();
}


/*
  Llamada a la API de Smart-Sound.
  Envía el token como Smart-Token y, si la sesión caduca (401),
  te manda al login.
*/

async function api(route, options = {}){

  let response;

  try{

    response = await fetch(API + route, {
      ...options,
      headers:{
        "Authorization": "Smart-Token " + TOKEN,
        ...(options.headers || {})
      }
    });

  }catch(error){

    console.error(error);

    throw new Error("No se pudo conectar con Smart-Sound.");
  }

  const data = await response.json().catch(() => ({}));

  if(response.status === 401){

    sessionExpired();

    const redirected = new Error("redirect");
    redirected.redirected = true;
    throw redirected;
  }

  if(!response.ok){

    const error = new Error(
      (typeof data.detail === "string" && data.detail) ||
      "Ocurrió un error."
    );

    error.status = response.status;

    throw error;
  }

  return data;
}


async function loadMe(){

  if(!TOKEN){

    goAuth();

    return false;
  }

  try{

    const data = await api("/api/me");

    ME = data.user || data;

    if(!ME || !ME.username){

      goAuth();

      return false;
    }

    $("me").textContent = "@" + ME.username;

    const img = $("mypfp");

    img.src = pfpUrl(ME.pfp || ME.profile_picture);

    img.onerror = () => {
      img.onerror = null;
      img.src = "https://via.placeholder.com/52";
    };

    return true;

  }catch(error){

    if(!error.redirected){
      showToast(error.message);
    }

    return false;
  }
}


async function loadLimits(){

  // /api es público: informa de los límites del servidor
  try{

    const response = await fetch(API + "/api");
    const data = await response.json();

    if(data && data.max_track_bytes){
      maxTrackBytes = data.max_track_bytes;
    }

  }catch(error){

    console.error(error);
  }
}


/* ============================================================
   BIBLIOTECA
============================================================ */

async function loadTracks(reset = true){

  if(loadingList){
    return;
  }

  loadingList = true;

  const offset = reset ? 0 : tracks.length;

  try{

    const params = new URLSearchParams({
      search: query,
      sort: sortBy,
      order: sortOrder,
      limit: PAGE_SIZE,
      offset: offset
    });

    const data = await api("/api/tracks?" + params.toString());

    tracks = reset ? data.tracks : tracks.concat(data.tracks);
    total = data.total;

    renderList();

  }catch(error){

    if(!error.redirected){
      showToast(error.message);
    }

  }finally{

    loadingList = false;
  }
}


function renderList(){
  const box = $("list");
  box.replaceChildren();

  $("count").textContent = total + (total === 1 ? " canción" : " canciones");

  if(!tracks.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = query
      ? "No se encontró ninguna canción con esa búsqueda."
      : "Todavía no has añadido canciones. Usa «Subir canción» para comenzar.";
    box.appendChild(empty);
    return;
  }

  tracks.forEach((track, index) => {
    const isPlaying = !!(currentTrack && currentTrack.id === track.id);
    const row = document.createElement("div");
    row.className = "row" + (isPlaying ? " playing" : "");
    row.dataset.id = track.id;
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-label", "Reproducir " + (track.title || track.original_name || "canción"));
    row.onclick = () => playTrack(track);
    row.onkeydown = event => {
      if((event.key === "Enter" || event.key === " ") && event.target === row){
        event.preventDefault();
        playTrack(track);
      }
    };

    const number = document.createElement("div");
    number.className = "track-index";
    number.textContent = isPlaying ? "♫" : String(index + 1);

    const main = document.createElement("div");
    main.className = "track-main";

    const art = document.createElement("div");
    art.className = "track-art";
    art.textContent = isPlaying && !audio.paused ? "♫" : "♪";

    const copy = document.createElement("div");
    copy.className = "track-main-copy";

    const title = document.createElement("div");
    title.className = "row-title";
    title.textContent = track.title || track.original_name || "Sin título";
    title.title = title.textContent;

    const sub = document.createElement("div");
    sub.className = "row-sub";
    sub.textContent = track.artist || "Artista desconocido";

    copy.append(title, sub);
    main.append(art, copy);

    const album = document.createElement("div");
    album.className = "row-album";
    album.textContent = track.album || "—";
    album.title = album.textContent;

    const genre = document.createElement("div");
    genre.className = "row-genre";
    genre.textContent = track.genre || "—";
    genre.title = genre.textContent;

    const size = document.createElement("div");
    size.className = "row-size";
    size.textContent = formatBytes(track.size_bytes);

    const actions = document.createElement("div");
    actions.className = "row-actions";

    const makeAction = (label, symbol, className, handler) => {
      const button = document.createElement("button");
      button.className = "icon-btn" + (className ? " " + className : "");
      button.type = "button";
      button.title = label;
      button.setAttribute("aria-label", label + ": " + (track.title || "canción"));
      button.textContent = symbol;
      button.onclick = event => {
        event.stopPropagation();
        handler(track);
      };
      return button;
    };

    actions.append(
      makeAction("Descargar", "↓", "", downloadTrack),
      makeAction("Editar", "✎", "", openEdit),
      makeAction("Eliminar", "×", "del", deleteTrack)
    );

    row.append(number, main, album, genre, size, actions);
    box.appendChild(row);
  });

  if(tracks.length < total){
    const more = document.createElement("button");
    more.className = "more-btn";
    more.type = "button";
    more.textContent = "Cargar más canciones · " + (total - tracks.length) + " restantes";
    more.onclick = () => loadTracks(false);
    box.appendChild(more);
  }
}


/* ============================================================
   REPRODUCTOR
============================================================ */

async function playTrack(track, startAt = 0){

  const myToken = ++playToken;

  try{

    const data = await api(
      "/api/tracks/" + encodeURIComponent(track.id) + "/playback-ticket",
      { method:"POST" }
    );

    // Si hiciste clic en otra canción mientras tanto, se ignora esta
    if(myToken !== playToken){
      return;
    }

    currentTrack = track;

    audio.src = API + data.stream_url;

    if(startAt > 0){

      audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = startAt;
      }, { once:true });
    }

    await audio.play().catch(error => {
      console.error(error);
      showToast("El navegador bloqueó la reproducción. Pulsa ▶.");
    });

    showNow(track, data.cover_url ? API + data.cover_url : "");

    renderList();

  }catch(error){

    if(!error.redirected){
      showToast(error.message);
    }
  }
}


function showNow(track, coverUrl){

  $("nowTitle").textContent = track.title;

  $("nowSub").textContent =
    [track.artist, track.album].filter(Boolean).join(" · ") ||
    "Artista desconocido";

  const cover = $("cover");

  cover.innerHTML = "";

  if(coverUrl){

    const img = document.createElement("img");

    img.alt = "Portada";
    img.src = coverUrl;

    img.onerror = () => {
      cover.innerHTML = "";
      cover.textContent = "🎵";
    };

    cover.appendChild(img);

  }else{

    cover.textContent = "🎵";
  }

  document.title = track.title + " · Smart-Sound";

  // Controles del sistema (teclas multimedia, pantalla de bloqueo)
  if("mediaSession" in navigator){

    try{

      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.artist || "",
        album: track.album || "",
        artwork: coverUrl ? [{ src: coverUrl }] : []
      });

      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("previoustrack", () => playPrevious());
      navigator.mediaSession.setActionHandler("nexttrack", () => playNext(true));

    }catch(error){

      console.error(error);
    }
  }
}


function clearNow(){

  currentTrack = null;
  playToken++;

  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  $("nowTitle").textContent = "Elige una canción";
  $("nowSub").textContent = "";
  $("cover").innerHTML = "";
  $("cover").textContent = "🎵";

  $("seekBar").value = 0;
  $("curTime").textContent = "0:00";
  $("durTime").textContent = "0:00";

  $("playBtn").textContent = "▶";

  document.title = "Smart-Sound";
}


function togglePlay(){

  if(!currentTrack){

    if(tracks.length){
      playTrack(tracks[0]);
    }

    return;
  }

  if(audio.paused){
    audio.play().catch(() => {});
  }else{
    audio.pause();
  }
}


function currentIndex(){

  if(!currentTrack){
    return -1;
  }

  return tracks.findIndex(track => track.id === currentTrack.id);
}


function playNext(manual = false){

  if(!tracks.length){
    return;
  }

  const index = currentIndex();

  if(shuffle && tracks.length > 1){

    let next;

    do{
      next = Math.floor(Math.random() * tracks.length);
    }while(next === index);

    playTrack(tracks[next]);

    return;
  }

  if(index < tracks.length - 1){

    playTrack(tracks[index + 1]);

    return;
  }

  // Última canción de la lista
  if(repeat === "all" || manual){

    playTrack(tracks[0]);

    return;
  }

  audio.pause();
  audio.currentTime = 0;
}


function playPrevious(){

  if(!tracks.length){
    return;
  }

  // Si ya avanzó, vuelve al principio de la canción
  if(audio.currentTime > 3){

    audio.currentTime = 0;

    return;
  }

  const index = currentIndex();

  playTrack(tracks[index > 0 ? index - 1 : tracks.length - 1]);
}


function refreshPlayButtons(){

  $("playBtn").textContent = audio.paused ? "▶" : "⏸";

  $("shuffleBtn").classList.toggle("on", shuffle);

  const repeatBtn = $("repeatBtn");

  repeatBtn.classList.toggle("on", repeat !== "off");
  repeatBtn.textContent = repeat === "one" ? "🔂" : "🔁";
  repeatBtn.title =
    repeat === "off" ? "Repetir: no" :
    repeat === "all" ? "Repetir: toda la lista" :
    "Repetir: esta canción";

  document.querySelectorAll(".row.playing .eq").forEach(eq => {
    eq.classList.toggle("paused", audio.paused);
  });
}


audio.addEventListener("play", refreshPlayButtons);
audio.addEventListener("pause", refreshPlayButtons);

audio.addEventListener("loadedmetadata", () => {
  $("durTime").textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {

  $("curTime").textContent = formatTime(audio.currentTime);

  if(!seeking && audio.duration){
    $("seekBar").value = (audio.currentTime / audio.duration) * 1000;
  }
});

audio.addEventListener("ended", () => {

  if(repeat === "one"){

    audio.currentTime = 0;
    audio.play().catch(() => {});

    return;
  }

  playNext(false);
});

// Si el enlace de reproducción caduca, se solicita otro y se intenta continuar
audio.addEventListener("error", () => {

  if(!currentTrack || retriedTicket){
    return;
  }

  retriedTicket = true;

  const resumeAt = audio.currentTime || 0;

  playTrack(currentTrack, resumeAt).finally(() => {
    retriedTicket = false;
  });
});


$("playBtn").onclick = togglePlay;
$("nextBtn").onclick = () => playNext(true);
$("prevBtn").onclick = playPrevious;

$("shuffleBtn").onclick = () => {

  shuffle = !shuffle;

  refreshPlayButtons();
};

$("repeatBtn").onclick = () => {

  repeat = repeat === "off" ? "all" : repeat === "all" ? "one" : "off";

  refreshPlayButtons();
};

$("seekBar").addEventListener("input", () => {

  seeking = true;

  if(audio.duration){
    $("curTime").textContent =
      formatTime((Number($("seekBar").value) / 1000) * audio.duration);
  }
});

$("seekBar").addEventListener("change", () => {

  if(audio.duration){
    audio.currentTime = (Number($("seekBar").value) / 1000) * audio.duration;
  }

  seeking = false;
});

$("volumeBar").addEventListener("input", () => {

  audio.volume = Number($("volumeBar").value) / 100;

  try{
    localStorage.setItem(VOLUME_KEY, $("volumeBar").value);
  }catch(error){}
});


/* ============================================================
   DIÁLOGO DE CONFIRMACIÓN
============================================================ */

function askDialog({ title, text = "", ok = "Aceptar", danger = false }){

  return new Promise(resolve => {

    const modal = $("dialog");
    const okBtn = $("dlgOk");
    const cancelBtn = $("dlgCancel");

    $("dlgTitle").textContent = title;
    $("dlgText").textContent = text;

    okBtn.textContent = ok;
    okBtn.className = danger ? "danger-btn" : "primary-btn";

    const done = result => {

      modal.classList.remove("show");

      okBtn.onclick = null;
      cancelBtn.onclick = null;

      resolve(result);
    };

    okBtn.onclick = () => done(true);
    cancelBtn.onclick = () => done(false);

    modal.classList.add("show");

    okBtn.focus();
  });
}


/* ============================================================
   ACCIONES
============================================================ */

async function deleteTrack(track){

  const confirmed = await askDialog({
    title: "¿Eliminar canción?",
    text: "Se eliminará «" + track.title + "» de tu biblioteca. Esta acción no se puede deshacer.",
    ok: "Eliminar",
    danger: true
  });

  if(!confirmed){
    return;
  }

  try{

    await api("/api/tracks/" + encodeURIComponent(track.id), {
      method:"DELETE"
    });

    if(currentTrack && currentTrack.id === track.id){
      clearNow();
    }

    showToast("Canción eliminada.");

    await loadTracks(true);

  }catch(error){

    if(!error.redirected){
      showToast(error.message);
    }
  }
}


async function downloadTrack(track){

  showToast("Preparando descarga...");

  try{

    // La descarga exige sesión, por eso se pide con el token y se guarda como archivo
    const response = await fetch(
      API + "/api/tracks/" + encodeURIComponent(track.id) + "/download",
      { headers:{ "Authorization": "Smart-Token " + TOKEN } }
    );

    if(response.status === 401){

      sessionExpired();

      return;
    }

    if(!response.ok){

      const data = await response.json().catch(() => ({}));

      throw new Error(data.detail || "No se pudo descargar.");
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = track.original_name || (track.title + (track.extension || ""));

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

  }catch(error){

    showToast(error.message || "No se pudo descargar.");
  }
}


/* ============================================================
   EDITAR
============================================================ */

function setStatus(boxId, message, type){

  const box = $(boxId);

  box.textContent = message || "";
  box.className = "status-box" + (message ? " show " + (type || "err") : "");
}


function openEdit(track){

  editingTrack = track;

  $("edTitle").value = track.title || "";
  $("edArtist").value = track.artist || "";
  $("edAlbum").value = track.album || "";
  $("edGenre").value = track.genre || "";
  $("edDesc").value = track.description || "";

  setStatus("editStatus", "");

  $("editModal").classList.add("show");

  $("edTitle").focus();
}


function closeEdit(){

  $("editModal").classList.remove("show");

  editingTrack = null;
}


async function saveEdit(){

  if(!editingTrack){
    return;
  }

  const title = $("edTitle").value.trim();

  if(!title){

    setStatus("editStatus", "El título no puede estar vacío.", "err");

    return;
  }

  const button = $("edSave");

  button.disabled = true;

  setStatus("editStatus", "Revisando y guardando...", "info");

  try{

    const data = await api(
      "/api/tracks/" + encodeURIComponent(editingTrack.id),
      {
        method:"PATCH",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          title,
          artist: $("edArtist").value,
          album: $("edAlbum").value,
          genre: $("edGenre").value,
          description: $("edDesc").value
        })
      }
    );

    const updated = data.track;

    // Actualiza la canción en la lista sin recargar todo
    const index = tracks.findIndex(item => item.id === updated.id);

    if(index >= 0){
      tracks[index] = updated;
    }

    if(currentTrack && currentTrack.id === updated.id){

      currentTrack = updated;

      $("nowTitle").textContent = updated.title;

      $("nowSub").textContent =
        [updated.artist, updated.album].filter(Boolean).join(" · ") ||
        "Artista desconocido";
    }

    renderList();

    closeEdit();

    showToast("Canción actualizada.");

  }catch(error){

    if(!error.redirected){
      setStatus("editStatus", error.message, "err");
    }

  }finally{

    button.disabled = false;
  }
}


/* ============================================================
   SUBIR
============================================================ */

function resetUploadForm(){

  ["upFile", "upCover"].forEach(id => { $(id).value = ""; });
  ["upTitle", "upArtist", "upAlbum", "upGenre", "upDesc"].forEach(id => { $(id).value = ""; });

  $("upCoverPreview").innerHTML = "";
  $("upCoverPreview").textContent = "🖼️";

  $("upBar").style.width = "0";

  $("upProgress").classList.remove("show");
  $("upProgressText").textContent = "";

  setStatus("uploadStatus", "");

  $("upSubmit").disabled = false;
}


function openUpload(){

  resetUploadForm();

  $("uploadModal").classList.add("show");
}


function closeUpload(){

  // Si hay una subida en curso, se cancela
  if(uploadXhr){

    uploadXhr.abort();

    uploadXhr = null;
  }

  $("uploadModal").classList.remove("show");
}


$("upFile").addEventListener("change", () => {

  const file = $("upFile").files[0];

  if(file && !$("upTitle").value.trim()){

    // El título se rellena con el nombre del archivo (sin la extensión)
    $("upTitle").value = file.name.replace(/\.[^.]+$/, "");
  }
});

$("upCover").addEventListener("change", () => {

  const file = $("upCover").files[0];
  const preview = $("upCoverPreview");

  preview.innerHTML = "";

  if(!file){

    preview.textContent = "🖼️";

    return;
  }

  const img = document.createElement("img");

  img.alt = "Portada";
  img.src = URL.createObjectURL(file);

  img.onload = () => URL.revokeObjectURL(img.src);

  preview.appendChild(img);
});


function submitUpload(){

  const file = $("upFile").files[0];
  const cover = $("upCover").files[0];

  if(!file){

    setStatus("uploadStatus", "Elige un archivo de audio.", "err");

    return;
  }

  if(!AUDIO_EXTENSIONS.includes(extOf(file.name))){

    setStatus(
      "uploadStatus",
      "Formato no admitido. Usa " +
      AUDIO_EXTENSIONS.map(ext => ext.slice(1).toUpperCase()).join(", ") + ".",
      "err"
    );

    return;
  }

  if(file.size > maxTrackBytes){

    setStatus(
      "uploadStatus",
      "El audio supera el límite de " + formatBytes(maxTrackBytes) + ".",
      "err"
    );

    return;
  }

  if(cover){

    if(!COVER_EXTENSIONS.includes(extOf(cover.name))){

      setStatus("uploadStatus", "La portada debe ser JPG, PNG o WEBP.", "err");

      return;
    }

    if(cover.size > MAX_COVER_BYTES){

      setStatus(
        "uploadStatus",
        "La portada supera el límite de " + formatBytes(MAX_COVER_BYTES) + ".",
        "err"
      );

      return;
    }
  }

  const form = new FormData();

  form.append("file", file);
  form.append("title", $("upTitle").value.trim());
  form.append("artist", $("upArtist").value.trim());
  form.append("album", $("upAlbum").value.trim());
  form.append("genre", $("upGenre").value.trim());
  form.append("description", $("upDesc").value.trim());

  if(cover){
    form.append("cover", cover);
  }

  setStatus("uploadStatus", "");

  $("upSubmit").disabled = true;

  $("upProgress").classList.add("show");
  $("upBar").style.width = "0";
  $("upProgressText").textContent = "Subiendo... 0%";

  const xhr = new XMLHttpRequest();

  uploadXhr = xhr;

  xhr.open("POST", API + "/api/tracks/upload");

  xhr.setRequestHeader("Authorization", "Smart-Token " + TOKEN);

  xhr.upload.onprogress = event => {

    if(!event.lengthComputable){
      return;
    }

    const percent = Math.floor((event.loaded / event.total) * 100);

    $("upBar").style.width = percent + "%";

    $("upProgressText").textContent =
      "Subiendo... " + percent + "% (" +
      formatBytes(event.loaded) + " de " + formatBytes(event.total) + ")";
  };

  // Al terminar de subir, el servidor revisa el texto y la portada antes de guardar
  xhr.upload.onload = () => {

    $("upBar").style.width = "100%";

    $("upProgressText").textContent = "Revisando el contenido y guardando...";
  };

  xhr.onload = async () => {

    uploadXhr = null;

    let data = {};

    try{
      data = JSON.parse(xhr.responseText || "{}");
    }catch(error){}

    if(xhr.status === 401){

      sessionExpired();

      return;
    }

    if(xhr.status >= 200 && xhr.status < 300){

      $("uploadModal").classList.remove("show");

      showToast("Canción subida.");

      await loadTracks(true);
  
      return;
    }

    $("upSubmit").disabled = false;

    $("upProgress").classList.remove("show");

    setStatus(
      "uploadStatus",
      (typeof data.detail === "string" && data.detail) ||
      "No se pudo subir la canción.",
      "err"
    );
  };

  xhr.onerror = () => {

    uploadXhr = null;

    $("upSubmit").disabled = false;

    $("upProgress").classList.remove("show");

    setStatus("uploadStatus", "Se perdió la conexión al subir.", "err");
  };

  xhr.onabort = () => {

    uploadXhr = null;
  };

  xhr.send(form);
}


/* ============================================================
   LOGOUT
============================================================ */

async function logout(){

  try{

    await fetch(API + "/api/logout", {
      method:"POST",
      headers:{ "Authorization": "Smart-Token " + TOKEN }
    });

  }catch(error){

    console.error(error);
  }

  localStorage.removeItem(TOKEN_KEY);

  TOKEN = "";

  goAuth();
}

   EVENTOS
============================================================ */


$("navSongs").onclick = () => {
  $("navSongs").classList.add("active");
  $("navRecent").classList.remove("active");
  $("viewTitle").textContent = "Canciones";
  $("viewDescription").textContent = "Tu música, organizada en un solo lugar.";
  sortBy = $("sort").value = "title";
  sortOrder = "asc";
  $("orderBtn").textContent = "▲";
  query = $("search").value.trim();
  loadTracks(true);
};

$("navRecent").onclick = () => {
  $("navRecent").classList.add("active");
  $("navSongs").classList.remove("active");
  $("viewTitle").textContent = "Añadidas recientemente";
  $("viewDescription").textContent = "Las canciones que has subido más recientemente.";
  sortBy = $("sort").value = "created";
  sortOrder = "desc";
  $("orderBtn").textContent = "▼";
  query = $("search").value.trim();
  loadTracks(true);
};


$("uploadBtn").onclick = openUpload;
$("upSubmit").onclick = submitUpload;
$("upCancel").onclick = closeUpload;

$("edSave").onclick = saveEdit;
$("edCancel").onclick = closeEdit;


$("editModal").addEventListener("click", event => {

  if(event.target.id === "editModal"){
    closeEdit();
  }
});

$("search").addEventListener("input", () => {

  clearTimeout(searchTimer);

  searchTimer = setTimeout(() => {

    query = $("search").value.trim();

    loadTracks(true);

  }, SEARCH_DELAY_MS);
});

$("sort").addEventListener("change", () => {

  sortBy = $("sort").value;

  // Para títulos y artistas es más natural empezar de la A a la Z
  if(["title", "artist", "album"].includes(sortBy)){
    sortOrder = "asc";
  }else{
    sortOrder = "desc";
  }

  $("orderBtn").textContent = sortOrder === "asc" ? "▲" : "▼";

  loadTracks(true);
});

$("orderBtn").onclick = () => {

  sortOrder = sortOrder === "asc" ? "desc" : "asc";

  $("orderBtn").textContent = sortOrder === "asc" ? "▲" : "▼";

  loadTracks(true);
};

document.addEventListener("keydown", event => {

  if(event.key === "Escape"){

    if($("dialog").classList.contains("show")){

      $("dlgCancel").click();

      return;
    }

    if($("uploadModal").classList.contains("show")){

      closeUpload();

      return;
    }

    closeEdit();

    return;
  }

  // Barra espaciadora: pausar o reproducir (si no estás escribiendo)
  if(event.code === "Space"){

    const tag = (document.activeElement?.tagName || "").toLowerCase();

    const typing = ["input", "textarea", "select", "button"].includes(tag);

    const modalOpen = document.querySelector(".modal.show");

    if(!typing && !modalOpen){

      event.preventDefault();

      togglePlay();
    }
  }
});

// Avisa si se intenta cerrar la página mientras se sube una canción
window.addEventListener("beforeunload", event => {

  if(uploadXhr){

    event.preventDefault();

    event.returnValue = "";
  }
});

  // Volumen guardado
  let savedVolume = 80;

  try{

    const stored = localStorage.getItem(VOLUME_KEY);

    if(stored !== null){
      savedVolume = Math.min(100, Math.max(0, Number(stored) || 0));
    }

  }catch(error){}

  $("volumeBar").value = savedVolume;

  audio.volume = savedVolume / 100;

  refreshPlayButtons();

  const authenticated = await loadMe();

  if(!authenticated){
    return;
  }

  $("app").style.display = "grid";


  await Promise.all([
    loadLimits(),
    loadTracks(true)
  ]);

})();
