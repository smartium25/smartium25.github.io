<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Call · 3PD</title>
<script src="./url.js"></script>
<script>
/* Expone URLS en window y recoge/sincroniza el Smart-Token (URL o almacenamiento) */
(function(){try{window.URLS=URLS;var u=new URL(location.href),h=new URLSearchParams(u.hash.slice(1)),K=['smart_token','smart_account_token','knfoundation_token'],t=u.searchParams.get('token')||h.get('token');for(var i=0;!t&&i<K.length;i++)t=localStorage.getItem(K[i]);if(t){t=String(t).replace(/^"|"$/g,'').trim();K.forEach(function(k){localStorage.setItem(k,t)})}if(u.searchParams.has('token')||h.has('token')){u.searchParams.delete('token');h.delete('token');u.hash=h.toString();history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}})();
</script>
<script>
// ---- CONFIGURACIÓN (las URLs se cambian en url.js) ----
const API=URLS.call, KN_AUTH_API=URLS.account, AUTH_URL=URLS.auth, TOKEN_KEY="smart_token";
const ICE_SERVERS=[{urls:"stun:stun.l.google.com:19302"}];
const BANNERS=[{name:"Logo Original",file:"banner 4.JPG"},{name:"Logo Moderno",file:"banner 5.JPG"},{name:"I ❤️ Smart-Call",file:"banner 6.JPG"}];
const BANNER_DIM=0.35, CUSTOM_BANNER_MAX_SIDE=1600, CUSTOM_BANNER_QUALITY=0.82, BANNER_STORAGE_PREFIX="smartcall_banner_";
const WS_RECONNECT_MS=2500, WS_PING_MS=20000;
</script>
<style>
:root{--bg:#252a33;--panel:#272d37;--card:#303640;--cyan:#00f0ff;--text:#f5f7fa;--muted:#9aa4b2;--green:#35d06f;--red:#ff5b67;--border:#3b424d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
/* El banner se pinta en TODA la pantalla (body); los paneles son translúcidos */
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg) center/cover no-repeat fixed;color:var(--text)}
button,input{font:inherit}button{border:0;cursor:pointer}
.app{width:100%;height:100vh;display:grid;grid-template-columns:minmax(220px,1fr) minmax(420px,1.42fr) minmax(220px,1fr)}
.panel{background:rgba(39,45,55,.8);backdrop-filter:blur(6px);padding:16px;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.panel:last-child{border-right:0;border-left:1px solid var(--border)}
.title{color:var(--cyan);background:var(--card);border-radius:12px;padding:12px 14px;text-align:center;font-weight:700;margin-bottom:12px}
.scroll{flex:1;min-height:0;overflow:auto;padding-right:2px}
.scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#46505c;border-radius:9px}
.user-card,.room-card{background:var(--card);border-radius:12px;margin-bottom:10px}
.user-card{display:flex;align-items:center;gap:10px;padding:10px}
.user-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);flex:none}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none}.status-dot.online{background:var(--green)}.status-dot.offline{background:#68707b}
.user-name,.room-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-name{flex:1;font-weight:600}
.call-btn,.primary-btn{background:var(--cyan);color:#081013;font-weight:700;border-radius:9px;padding:9px 11px}
.call-btn:hover,.primary-btn:hover{background:#5ff6ff}.full{width:100%}
.center{background:transparent;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#profile{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.big-pfp{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--cyan);background:#171b21;margin-bottom:18px}
.profile-name{font-size:22px;font-weight:700;margin-bottom:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.profile-sub{color:#dfe5ec;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.logout-btn,.banner-open-btn,.secondary-btn{background:#454c57;color:#fff;border-radius:9px;padding:10px 18px;font-weight:700;margin-top:8px}
.logout-btn:hover,.banner-open-btn:hover,.secondary-btn:hover{background:#515a66}
#call{display:none;width:100%;height:100%;flex-direction:column;min-height:0}
.call-head{padding:13px 15px;background:rgba(48,54,64,.9);color:var(--cyan);font-weight:700;text-align:center;flex:none}
#callError{display:none;margin:12px 14px 0;padding:10px 12px;border-radius:10px;background:#3b2428;color:#ffafb5;border:1px solid #70434a;font-size:13px;flex:none}
#videos{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:10px;padding:14px}
.video-box{position:relative;background:#090b0e;border-radius:11px;overflow:hidden;width:280px;max-width:100%;border:1px solid #3a4048}
.video-box video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#090b0e}
.video-label{position:absolute;left:8px;bottom:8px;padding:5px 8px;background:rgba(0,0,0,.68);border-radius:7px;font-size:12px}
.controls{display:flex;gap:9px;padding:12px 14px;background:rgba(48,54,64,.9);flex:none}
.end-btn{background:var(--red);color:#fff;font-weight:700;border-radius:9px;padding:10px 13px}.end-btn:hover{filter:brightness(1.08)}
.toggle-btn{background:#454c57;color:#fff;border-radius:9px;width:42px;height:42px;flex:none}.toggle-btn:hover{background:#515a66}
.toggle-btn.off{background:#3b2428;border:1px solid #70434a}
input{width:100%;background:#1e232b;color:var(--text);border:1px solid #434b56;border-radius:9px;padding:11px 12px;outline:none;margin-bottom:9px}input:focus{border-color:var(--cyan)}
.room-card{position:relative;padding:11px 86px 11px 12px;min-height:66px;display:flex;align-items:center}
.room-info{width:100%;min-width:0}.room-name{font-weight:700}
.room-creator{margin-top:4px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-card .primary-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.empty{color:var(--muted);font-size:13px;padding:8px 2px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}
.modal-card{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.banner-opt{background:var(--card);border:2px solid transparent;border-radius:12px;padding:6px;color:var(--text);text-align:center;font-size:12px;font-weight:600}
.banner-opt:hover{background:#353c47}.banner-opt.active{border-color:var(--cyan)}
.banner-opt img,.banner-opt .banner-none{display:block;width:100%;height:80px;object-fit:cover;border-radius:8px;margin-bottom:6px;background:#21262e}
.banner-opt .banner-none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.banner-actions{display:flex;gap:9px;flex-wrap:wrap}.banner-actions button{flex:1;min-width:120px;margin-top:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2128;border:1px solid #414954;color:#fff;padding:9px 13px;border-radius:9px;font-size:12px;display:none;z-index:40}.toast.show{display:block}
@media(max-width:900px){.app{grid-template-columns:220px 1fr}.app>.panel:last-child{display:none}}
@media(max-width:600px){.app{grid-template-columns:1fr}.app>.panel:first-child{display:none}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
 <aside class="panel"><div class="title">Usuarios</div><div class="scroll" id="users"></div></aside>
 <main class="center" id="center">
  <section id="profile">
   <img id="mypfp" class="big-pfp" src="https://via.placeholder.com/150" alt="Foto de perfil">
   <div id="me" class="profile-name"></div>
   <div class="profile-sub">Selecciona a alguien para iniciar una llamada</div>
   <button class="logout-btn" onclick="logout()">LOG OUT</button>
   <button id="bannerOpenBtn" class="banner-open-btn" type="button">🎨 BANNER</button>
  </section>
  <section id="call">
   <div class="call-head" id="callHead">Llamada</div>
   <div id="callError"></div>
   <div id="videos"></div>
   <div class="controls">
    <button class="primary-btn full" onclick="startCurrentCall()">📞 Llamar</button>
    <button id="micBtn" class="toggle-btn" type="button" title="Silenciar micrófono" onclick="toggleMic()">🎤</button>
    <button id="camBtn" class="toggle-btn" type="button" title="Ocultar cámara" onclick="toggleCam()">📷</button>
    <button class="end-btn full" onclick="endCall()">Colgar</button>
   </div>
  </section>
 </main>
 <aside class="panel">
  <div class="title">Crear Grupo</div>
  <input id="room" placeholder="Nombre grupo" maxlength="80" autocomplete="off">
  <button class="primary-btn full" onclick="createRoom()">Crear Grupo</button>
  <div class="title" style="margin-top:14px">Salas</div>
  <div class="scroll" id="rooms"></div>
 </aside>
</div>

<div id="bannerModal" class="modal"><div class="modal-card">
 <div class="title">Elige tu banner</div><div id="bannerGrid" class="banner-grid"></div>
 <input id="bannerFileInput" type="file" accept="image/*" hidden>
 <div class="banner-actions"><button id="bannerUploadBtn" class="primary-btn" type="button">📷 Subir mi foto</button><button id="bannerCloseBtn" class="secondary-btn" type="button">Cerrar</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
let TOKEN=localStorage.getItem(TOKEN_KEY)||"", ME=null, ws=null, localStream=null, peers={}, pendingIce={}, currentTarget="", currentRoom="", reconnectTimer=null, reconnecting=false, micMuted=false, camHidden=false, toastTimer=null, redirecting=false;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const authHeaders=()=>({Authorization:"Smart-Token "+TOKEN});
function pfpUrl(v){if(!v)return"https://via.placeholder.com/44";if(/^https?:/.test(v))return v;return KN_AUTH_API+(v.startsWith("/")?v:"/"+v)}
function toast(m){const b=$("toast");b.textContent=m||"Ocurrió un error.";b.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.remove("show"),2800)}
function showCallError(m){const b=$("callError");b.textContent=m||"Ocurrió un error.";b.style.display="block"}
function hideCallError(){$("callError").style.display="none"}
function showCallScreen(t){$("profile").style.display="none";$("call").style.display="flex";$("callHead").textContent=t||"Llamada"}
function showProfile(){$("call").style.display="none";$("profile").style.display="flex"}
function goAuth(){if(redirecting)return;redirecting=true;location.replace(AUTH_URL+(AUTH_URL.includes("?")?"&":"?")+"redirect="+encodeURIComponent(location.origin+location.pathname))}
function dropToken(){["smart_token","smart_account_token","knfoundation_token"].forEach(k=>localStorage.removeItem(k));TOKEN=""}
/* Llamada a la API: añade el Smart-Token y manda al login si la sesión caduca */
async function api(path,opt={}){
 const r=await fetch(API+path,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});
 if(r.status===401||r.status===403){dropToken();goAuth();throw new Error("redirect")}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"Error "+r.status);return d}

async function loadMe(){
 if(!TOKEN){goAuth();return false}
 try{const d=await api("/api/me");ME=d.user||d;if(!ME||!ME.username){showCallError("No se obtuvo el usuario.");return false}
  $("me").textContent="@"+ME.username;const i=$("mypfp");i.src=pfpUrl(ME.pfp||ME.profile_picture);i.onerror=()=>{i.onerror=null;i.src="https://via.placeholder.com/150"};return true}
 catch(e){if(e.message!=="redirect")showCallError("No se pudo conectar con Smart-Call.");return false}}

async function loadUsers(){
 try{const d=await api("/api/users/list/"+encodeURIComponent(ME.username)),list=Array.isArray(d)?d:(d.users||[]),box=$("users");box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="empty">No hay otros usuarios.</div>';return}
  list.forEach(u=>{const c=el("div","user-card"),img=el("img");img.src=pfpUrl(u.pfp||u.profile_picture);img.onerror=()=>{img.onerror=null;img.src="https://via.placeholder.com/44"};
   const b=el("button","call-btn","📞");b.title="Llamar";b.onclick=()=>callUser(u.username);
   c.append(img,el("div","status-dot "+(u.online?"online":"offline")),el("div","user-name","@"+u.username),b);box.appendChild(c)})}
 catch(e){if(e.message!=="redirect")$("users").innerHTML='<div class="empty">No se pudieron cargar los usuarios.</div>'}}

async function loadRooms(){
 try{const d=await api("/api/rooms"),list=Array.isArray(d)?d:(d.rooms||[]),box=$("rooms");box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="empty">No hay salas todavía.</div>';return}
  list.forEach(r=>{const c=el("div","room-card"),info=el("div","room-info");info.append(el("div","room-name",r.name),el("div","room-creator","Creado por @"+(r.creator||"desconocido")));
   const b=el("button","primary-btn","LLAMAR");b.onclick=()=>joinRoom(r.name);c.append(info,b);box.appendChild(c)})}
 catch(e){if(e.message!=="redirect")$("rooms").innerHTML='<div class="empty">No se pudieron cargar las salas.</div>'}}
async function createRoom(){
 hideCallError();const input=$("room"),name=input.value.trim();if(!name)return showCallError("Escribe un nombre para el grupo.");
 try{const d=await api("/api/rooms?name="+encodeURIComponent(name),{method:"POST"});input.value="";await loadRooms();await joinRoom(d.room||name)}
 catch(e){if(e.message!=="redirect")showCallError(e.message)}}

/* ---------- Cámara y micrófono ---------- */
async function initMedia(){
 if(localStream)return localStream;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showCallError("Tu navegador no permite usar cámara y micrófono desde esta página.");return null}
 try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});applyTrackStates();addVideo(ME.username,localStream,true);return localStream}
 catch(e){showCallError(e.name==="NotAllowedError"?"Permite el acceso a la cámara y al micrófono para realizar la llamada.":"No se pudo acceder a la cámara o al micrófono.");return null}}
function applyTrackStates(){
 if(localStream){localStream.getAudioTracks().forEach(t=>t.enabled=!micMuted);localStream.getVideoTracks().forEach(t=>t.enabled=!camHidden)}refreshToggleButtons()}
function refreshToggleButtons(){
 const m=$("micBtn"),c=$("camBtn");m.textContent=micMuted?"🔇":"🎤";m.title=micMuted?"Activar micrófono":"Silenciar micrófono";m.classList.toggle("off",micMuted);
 c.textContent=camHidden?"🚫":"📷";c.title=camHidden?"Mostrar cámara":"Ocultar cámara";c.classList.toggle("off",camHidden)}
function toggleMic(){micMuted=!micMuted;applyTrackStates()}
function toggleCam(){camHidden=!camHidden;applyTrackStates()}

/* ---------- WebRTC ---------- */
function createPeerConnection(user){
 const p=new RTCPeerConnection({iceServers:ICE_SERVERS});
 if(localStream)localStream.getTracks().forEach(t=>p.addTrack(t,localStream));
 p.ontrack=e=>{if(e.streams&&e.streams[0])addVideo(user,e.streams[0],false)};
 p.onicecandidate=e=>{if(e.candidate)sendSocket({type:"ice",to:user,candidate:e.candidate})};
 p.onconnectionstatechange=()=>{if(p.connectionState==="failed"||p.connectionState==="closed")removePeer(user)};
 peers[user]=p;return p}
async function createPeer(user,makeOffer){
 if(peers[user])return peers[user];if(!(await initMedia()))return null;
 const p=createPeerConnection(user);
 if(makeOffer){try{const o=await p.createOffer();await p.setLocalDescription(o);sendSocket({type:"offer",to:user,offer:p.localDescription})}catch(e){console.error(e);removePeer(user)}}
 return p}
async function flushIce(user,p){for(const c of (pendingIce[user]||[])){try{await p.addIceCandidate(new RTCIceCandidate(c))}catch(e){console.error(e)}}delete pendingIce[user]}
async function handleOffer(d){
 if(!d.from)return;showCallScreen("Llamada con @"+d.from);
 const p=await createPeer(d.from,false);if(!p)return;
 try{await p.setRemoteDescription(new RTCSessionDescription(d.offer));await flushIce(d.from,p);const a=await p.createAnswer();await p.setLocalDescription(a);sendSocket({type:"answer",to:d.from,answer:p.localDescription})}
 catch(e){console.error(e);showCallError("No se pudo establecer la llamada.")}}
async function handleAnswer(d){const p=peers[d.from];if(!p)return;try{await p.setRemoteDescription(new RTCSessionDescription(d.answer));await flushIce(d.from,p)}catch(e){console.error(e)}}
async function handleIce(d){
 if(!d.from||!d.candidate)return;const p=peers[d.from];
 if(!p||!p.remoteDescription||!p.remoteDescription.type){(pendingIce[d.from]=pendingIce[d.from]||[]).push(d.candidate);return}
 try{await p.addIceCandidate(new RTCIceCandidate(d.candidate))}catch(e){console.error(e)}}

function vid(user){return"video-"+String(user).replace(/[^a-zA-Z0-9_-]/g,"_")}
function addVideo(user,stream,local){
 let box=$(vid(user));
 if(!box){box=el("div","video-box");box.id=vid(user);const v=el("video");v.autoplay=true;v.playsInline=true;v.muted=!!local;v.srcObject=stream;
  box.append(v,el("div","video-label",local?"Tú":"@"+user));$("videos").appendChild(box)}
 else{const v=box.querySelector("video");if(v)v.srcObject=stream}}
function removePeer(user){
 if(peers[user]){try{peers[user].close()}catch(e){}delete peers[user]}delete pendingIce[user];const b=$(vid(user));if(b)b.remove()}

/* ---------- Llamadas ---------- */
function callUser(user){currentRoom="";currentTarget=user;showCallScreen("Llamada con @"+user);hideCallError();startCurrentCall()}
async function startCurrentCall(){
 hideCallError();if(!currentTarget&&!currentRoom)return showCallError("Selecciona un usuario o una sala primero.");
 if(!ws||ws.readyState!==WebSocket.OPEN){showCallError("El servidor de llamadas no está conectado.");connectSocket(true);return}
 if(!(await initMedia()))return;if(currentTarget)await createPeer(currentTarget,true)}
async function joinRoom(room){
 hideCallError();if(!room)return;await endCall(false);currentRoom=room;currentTarget="";showCallScreen("Grupo: "+room);
 if(!ws||ws.readyState!==WebSocket.OPEN){showCallError("El servidor de llamadas no está conectado.");connectSocket(true);return}
 if(!(await initMedia()))return;sendSocket({type:"join_room",room})}

/* ---------- WebSocket ---------- */
const wsUrl=()=>API.replace(/^http:/,"ws:").replace(/^https:/,"wss:");
function sendSocket(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
function connectSocket(retry=false){
 if(!ME||!TOKEN)return;if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
 if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}reconnecting=false;
 try{ws=new WebSocket(wsUrl()+"/ws/"+encodeURIComponent(ME.username)+"?token="+encodeURIComponent(TOKEN))}catch(e){if(retry)scheduleReconnect();return}
 ws.onopen=()=>{if(currentRoom)sendSocket({type:"join_room",room:currentRoom})};
 ws.onmessage=async ev=>{try{const d=JSON.parse(ev.data);switch(d.type){
  case"room_users":if(d.room!==currentRoom)break;for(const u of (d.users||[])){if(u!==ME.username)await createPeer(u,true)}break;
  case"room_user_joined":if(d.room===currentRoom&&d.username!==ME.username)await createPeer(d.username,false);break;
  case"room_user_left":if(d.room===currentRoom)removePeer(d.username);break;
  case"offer":if(!currentRoom&&!currentTarget)currentTarget=d.from||"";await handleOffer(d);break;
  case"answer":await handleAnswer(d);break;
  case"ice":await handleIce(d);break;
  case"end_call":removePeer(d.from);if(!Object.keys(peers).length&&!currentRoom)showProfile();break;
  case"error":showCallError(d.message||"Error del servidor.");break}}catch(e){console.error(e)}};
 ws.onclose=ev=>{ws=null;if(ev&&ev.code===4401){dropToken();goAuth();return}if(TOKEN&&ME)scheduleReconnect()};
 ws.onerror=()=>{if(retry)scheduleReconnect()}}
function scheduleReconnect(){if(reconnecting||!TOKEN||!ME)return;reconnecting=true;reconnectTimer=setTimeout(()=>{reconnecting=false;reconnectTimer=null;connectSocket()},WS_RECONNECT_MS)}
setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN){try{ws.send("ping")}catch(e){}}},WS_PING_MS);

/* ---------- Colgar / logout ---------- */
async function endCall(back=true){
 for(const u of Object.keys(peers)){sendSocket({type:"end_call",to:u});try{peers[u].close()}catch(e){}}
 peers={};pendingIce={};
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 micMuted=false;camHidden=false;refreshToggleButtons();$("videos").innerHTML="";
 if(currentRoom)sendSocket({type:"leave_room",room:currentRoom});
 currentTarget="";currentRoom="";hideCallError();if(back)showProfile()}
async function logout(){
 try{await endCall(false);if(ws){try{ws.close()}catch(e){}ws=null}await fetch(API+"/api/logout",{method:"POST",headers:authHeaders()})}catch(e){}
 dropToken();ME=null;goAuth()}

/* ---------- Banners (ocupan toda la pantalla) ---------- */
const bannerKey=()=>BANNER_STORAGE_PREFIX+(ME&&ME.username||"");
const sget=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
function sset(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch(e){return false}}
function applyBanner(src){document.body.style.backgroundImage=src?`linear-gradient(rgba(20,24,30,${BANNER_DIM}),rgba(20,24,30,${BANNER_DIM})), url("${src}")`:""}
function currentBannerSrc(){const c=sget(bannerKey());return c==="custom"?sget(bannerKey()+"_custom"):c}
function renderBannerGrid(){
 const grid=$("bannerGrid"),choice=sget(bannerKey()),custom=sget(bannerKey()+"_custom");grid.innerHTML="";
 const add=(label,preview,value)=>{const b=el("button","banner-opt"+(choice===value?" active":""));b.type="button";
  if(preview){const i=el("img");i.src=preview;i.alt=label;i.onerror=()=>{i.onerror=null;i.replaceWith(el("div","banner-none","No encontrado"))};b.appendChild(i)}
  else b.appendChild(el("div","banner-none","Fondo gris"));
  b.appendChild(el("div",null,label));b.onclick=()=>selectBanner(value);grid.appendChild(b)};
 BANNERS.forEach(x=>add(x.name,x.file,x.file));if(custom)add("Mi foto",custom,"custom");add("Sin banner","","")}
function selectBanner(v){sset(bannerKey(),v);applyBanner(currentBannerSrc());renderBannerGrid()}
function fileToBannerData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("No se pudo leer la imagen."));
 r.onload=()=>{const img=new Image();img.onerror=()=>no(new Error("El archivo no es una imagen válida."));
  img.onload=()=>{const s=Math.min(1,CUSTOM_BANNER_MAX_SIDE/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",CUSTOM_BANNER_QUALITY))};img.src=r.result};r.readAsDataURL(file)})}
async function uploadBanner(file){
 if(!file)return;if(!file.type.startsWith("image/"))return toast("Elige una imagen (JPG, PNG, WEBP...).");
 try{const d=await fileToBannerData(file);if(!sset(bannerKey()+"_custom",d))return toast("La foto es demasiado grande para guardarla.");selectBanner("custom");toast("Banner actualizado.")}catch(e){toast(e.message)}}
$("bannerOpenBtn").onclick=()=>{renderBannerGrid();$("bannerModal").classList.add("show")};
$("bannerCloseBtn").onclick=()=>$("bannerModal").classList.remove("show");
$("bannerModal").addEventListener("click",e=>{if(e.target.id==="bannerModal")e.target.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("bannerModal").classList.remove("show")});
$("bannerUploadBtn").onclick=()=>$("bannerFileInput").click();
$("bannerFileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)uploadBanner(f);e.target.value=""});

(async function(){
 if(!(await loadMe()))return;
 $("app").style.display="grid";applyBanner(currentBannerSrc());
 await Promise.all([loadUsers(),loadRooms()]);connectSocket()})();
</script>
