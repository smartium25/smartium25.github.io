<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Remodelación</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #202020;
            padding: 40px 30px;
            border-radius: 8px;
            border-top: 4px solid #00bcd4;
            max-width: 500px;
            width: 90%;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        h1 {
            color: #00bcd4;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.5;
            color: #d0d0d0;
            margin-bottom: 30px;
        }

        .discord-box {
            background-color: #1a1a1a;
            border: 1px solid #00bcd4;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-block;
            font-family: monospace;
            font-size: 1.1rem;
            color: #00bcd4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ En Remodelación</h1>
        <p>Santiago, esto está en remodelación, así que añádeme en Discord, te veo a las 3 de la tarde.</p>
        <div class="discord-box">
            User Discord: okmanana_53438
        </div>
    </div>

</body>
</html>
