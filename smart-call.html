<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Call · 3PD</title>
  
<script src="./url.js"></script>

<script>
// ==========================================================
// CONFIGURACIÓN  (aquí cambias las URLs, los banners y los límites)
// ==========================================================

// Las URLs se cambian en url.js (misma carpeta que este HTML)

// Dirección de esta API (Smart-Call, el api.py de llamadas, puerto 8003)
const API = URLS.call;

// Dirección de la API de Smart-Account (sirve las fotos de perfil: /pfp/...)
const KN_AUTH_API = URLS.account;

// Página de inicio de sesión
const AUTH_URL = URLS.auth;

// Nombre con el que la página de login guarda el token en el navegador
// (debe ser EXACTAMENTE el mismo que usa tu auth nuevo)
const TOKEN_KEY = "smart_token";

// Servidor STUN para las llamadas (puedes añadir más, o servidores TURN)
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" }
];

// Banners (están en la misma carpeta que este HTML)
const BANNERS = [
  { name: "Logo Original", file: "banner3.png" },
  { name: "Logo Moderno", file: "banner4.png" },
  { name: "I ❤️ Smart-Call", file: "banner5.png" }
];

// Oscurecimiento sobre el banner para que el texto se lea (0 = nada, 1 = negro)
const BANNER_DIM = 0.35;

// Foto personalizada: lado máximo en píxeles y calidad JPEG (0 a 1)
const CUSTOM_BANNER_MAX_SIDE = 1600;
const CUSTOM_BANNER_QUALITY = 0.82;

// Prefijo con el que se guarda el banner elegido (uno por usuario)
const BANNER_STORAGE_PREFIX = "smartcall_banner_";

// Tiempos (ms): reconexión del WebSocket y aviso "ping" para mantenerlo vivo
const WS_RECONNECT_MS = 2500;
const WS_PING_MS = 20000;
</script>
  
<style>
:root{
  --bg:#252a33;
  --panel:#272d37;
  --card:#303640;
  --cyan:#00f0ff;
  --cyan2:#00c8d7;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --green:#35d06f;
  --red:#ff5b67;
  --border:#3b424d;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input{font:inherit;}
button{border:0;cursor:pointer;}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:minmax(220px,1fr) minmax(420px,1.42fr) minmax(220px,1fr);
  gap:1px;
  background:var(--border);
}

.panel{
  background:var(--panel);
  padding:16px;
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.title{
  color:var(--cyan);
  background:var(--card);
  border-radius:12px;
  padding:12px 14px;
  text-align:center;
  font-weight:700;
  margin-bottom:12px;
}

.scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding-right:2px;
}
.scroll::-webkit-scrollbar{width:7px;}
.scroll::-webkit-scrollbar-thumb{background:#46505c;border-radius:9px;}

.user-card,.room-card{
  background:var(--card);
  border-radius:12px;
  margin-bottom:10px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

.user-card img{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--cyan);
  flex:none;
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:none;
}
.status-dot.online{background:var(--green);}
.status-dot.offline{background:#68707b;}

.user-name,.room-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.user-name{
  flex:1;
  font-weight:600;
}

.call-btn,.primary-btn{
  background:var(--cyan);
  color:#081013;
  font-weight:700;
  border-radius:9px;
  padding:9px 11px;
}
.call-btn:hover,.primary-btn:hover{background:#5ff6ff;}

.full{width:100%;}

.center{
  background:#21262e;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#profile{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px;
  text-align:center;
}

.big-pfp{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--cyan);
  background:#171b21;
  margin-bottom:18px;
}

.profile-name{
  font-size:22px;
  font-weight:700;
  margin-bottom:16px;
}

.profile-sub{
  color:var(--muted);
  font-size:14px;
}

#call{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
  min-height:0;
}

.call-head{
  padding:13px 15px;
  background:var(--card);
  color:var(--cyan);
  font-weight:700;
  text-align:center;
  flex:none;
}

#callError{
  display:none;
  margin:12px 14px 0;
  padding:10px 12px;
  border-radius:10px;
  background:#3b2428;
  color:#ffafb5;
  border:1px solid #70434a;
  font-size:13px;
  flex:none;
}

#videos{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  align-items:flex-start;
  gap:10px;
  padding:14px;
}

.video-box{
  position:relative;
  background:#090b0e;
  border-radius:11px;
  overflow:hidden;
  width:280px;
  max-width:100%;
  border:1px solid #3a4048;
}

.video-box video{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#090b0e;
}

.video-label{
  position:absolute;
  left:8px;
  bottom:8px;
  padding:5px 8px;
  background:rgba(0,0,0,.68);
  border-radius:7px;
  font-size:12px;
}

.controls{
  display:flex;
  gap:9px;
  padding:12px 14px;
  background:var(--card);
  flex:none;
}

.end-btn{
  background:var(--red);
  color:#fff;
  font-weight:700;
  border-radius:9px;
  padding:10px 13px;
}
.end-btn:hover{filter:brightness(1.08);}

.toggle-btn{
  background:#454c57;
  color:#fff;
  border-radius:9px;
  width:42px;
  height:42px;
  flex:none;
}
.toggle-btn:hover{background:#515a66;}
.toggle-btn.off{
  background:#3b2428;
  border:1px solid #70434a;
}

input{
  width:100%;
  background:#1e232b;
  color:var(--text);
  border:1px solid #434b56;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  margin-bottom:9px;
}
input:focus{border-color:var(--cyan);}

.room-card{
  position:relative;
  padding:11px 86px 11px 12px;
  min-height:66px;
  display:flex;
  align-items:center;
}

.room-info{width:100%;}
.room-name{font-weight:700;}
.room-creator{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.room-card .primary-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
}

.empty{
  color:var(--muted);
  font-size:13px;
  padding:8px 2px;
  text-align:center;
}

.logout-btn{
  margin-top:8px;
  background:#454c57;
  color:#fff;
  border-radius:9px;
  padding:10px 13px;
}
.logout-btn:hover{background:#515a66;}

.banner-open-btn{
  margin-top:8px;
  background:#454c57;
  color:#fff;
  border-radius:9px;
  padding:10px 13px;
}
.banner-open-btn:hover{background:#515a66;}

/* ---------- Banners (tarjeta de selección) ---------- */

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,12,16,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:30;
}
.modal.show{display:flex;}

.modal-card{
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}

.banner-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-bottom:14px;
}

.banner-opt{
  background:var(--card);
  border:2px solid transparent;
  border-radius:12px;
  padding:6px;
  color:var(--text);
  text-align:center;
  font-size:12px;
  font-weight:600;
}
.banner-opt:hover{background:#353c47;}
.banner-opt.active{border-color:var(--cyan);}

.banner-opt img,
.banner-opt .banner-none{
  display:block;
  width:100%;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:6px;
  background:#21262e;
}

.banner-opt .banner-none{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:11px;
}

.banner-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
.banner-actions button{
  flex:1;
  min-width:120px;
}

.secondary-btn{
  background:#454c57;
  color:#fff;
  font-weight:700;
  border-radius:9px;
  padding:10px 14px;
}
.secondary-btn:hover{background:#515a66;}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#1d2128;
  border:1px solid #414954;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  font-size:12px;
  display:none;
  z-index:40;
}
.toast.show{display:block;}

@media(max-width:900px){
  .app{grid-template-columns:220px 1fr;}
  .app>.panel:last-child{display:none;}
}

@media(max-width:600px){
  .app{grid-template-columns:1fr;}
  .app>.panel:first-child{display:none;}
  .center{height:100vh;}
}
</style>
</head>
<body>

<div class="app" id="app" style="display:none;">

  <aside class="panel">
    <div class="title">Usuarios</div>
    <div class="scroll" id="users"></div>
  </aside>

  <main class="center" id="center">
    <section id="profile">
      <img id="mypfp" class="big-pfp" src="https://via.placeholder.com/150" alt="Foto de perfil">
      <div id="me" class="profile-name"></div>
      <div class="profile-sub">Selecciona a alguien para iniciar una llamada</div>
      <button class="logout-btn" onclick="logout()">LOG OUT</button>
      <button id="bannerOpenBtn" class="banner-open-btn" type="button">🎨 BANNER</button>
    </section>

    <section id="call">
      <div class="call-head" id="callHead">Llamada</div>
      <div id="callError"></div>
      <div id="videos"></div>
      <div class="controls">
        <button class="primary-btn full" onclick="startCurrentCall()">📞 Llamar</button>
        <button id="micBtn" class="toggle-btn" type="button" title="Silenciar micrófono" onclick="toggleMic()">🎤</button>
        <button id="camBtn" class="toggle-btn" type="button" title="Ocultar cámara" onclick="toggleCam()">📷</button>
        <button class="end-btn full" onclick="endCall()">Colgar</button>
      </div>
    </section>
  </main>

  <aside class="panel">
    <div class="title">Crear Grupo</div>
    <input id="room" placeholder="Nombre grupo" maxlength="80" autocomplete="off">
    <button class="primary-btn full" onclick="createRoom()">Crear Grupo</button>

    <div class="title" style="margin-top:14px;">Salas</div>
    <div class="scroll" id="rooms"></div>
  </aside>

</div>

<!-- TARJETA DE BANNERS -->

<div id="bannerModal" class="modal">
  <div class="modal-card">

    <div class="title">Elige tu banner</div>

    <div id="bannerGrid" class="banner-grid"></div>

    <input id="bannerFileInput" type="file" accept="image/*" hidden>

    <div class="banner-actions">
      <button id="bannerUploadBtn" class="primary-btn" type="button">📷 Subir mi foto</button>
      <button id="bannerCloseBtn" class="secondary-btn" type="button">Cerrar</button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// ESTADO
// ============================================================

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let ME = null;
let ws = null;
let localStream = null;
let peers = {};
let pendingIce = {};
let currentTarget = "";
let currentRoom = "";
let reconnectTimer = null;
let reconnecting = false;
let micMuted = false;
let camHidden = false;
let toastTimer = null;

// ============================================================
// UTILIDADES
// ============================================================

function authHeaders(){
  return {
    "Authorization": `Smart-Token ${TOKEN}`
  };
}

function pfpUrl(value){
  if(!value) return "https://via.placeholder.com/44";
  if(value.startsWith("http://") || value.startsWith("https://")) return value;
  return KN_AUTH_API + value;
}

function showToast(message){
  const box = document.getElementById("toast");
  box.textContent = message || "Ocurrió un error.";
  box.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("show"), 2800);
}

function showCallError(message){
  const box = document.getElementById("callError");
  box.textContent = message || "Ocurrió un error.";
  box.style.display = "block";
}

function hideCallError(){
  const box = document.getElementById("callError");
  box.textContent = "";
  box.style.display = "none";
}

function showCallScreen(title){
  document.getElementById("profile").style.display = "none";
  document.getElementById("call").style.display = "flex";
  document.getElementById("callHead").textContent = title || "Llamada";
}

function showProfile(){
  document.getElementById("call").style.display = "none";
  document.getElementById("profile").style.display = "flex";
}

function goAuth(){

    const returnUrl =
        window.location.href;

    const authUrl =
        AUTH_URL +
        "?redirect=" +
        encodeURIComponent(returnUrl);

    window.location.replace(
        authUrl
    );
}

function stopReconnect(){
  if(reconnectTimer){
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
  reconnecting = false;
}

// ============================================================
// SESIÓN
// ============================================================

async function loadMe(){
  if(!TOKEN){
    goAuth();
    return false;
  }

  try{
    const response = await fetch(`${API}/api/me`, {
      headers: authHeaders()
    });

    if(response.status === 401 || response.status === 403){
      localStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      goAuth();
      return false;
    }

    if(!response.ok){
      showCallError("No se pudo verificar la sesión.");
      return false;
    }

    const data = await response.json();
    ME = data.user || data;

    if(!ME || !ME.username){
      showCallError("Kn Foundation no devolvió el usuario.");
      return false;
    }

    document.getElementById("me").textContent = "@" + ME.username;
    document.getElementById("mypfp").src = pfpUrl(ME.pfp || ME.profile_picture);
    document.getElementById("mypfp").onerror = () => {
      document.getElementById("mypfp").src = "https://via.placeholder.com/150";
    };

    return true;
  }catch(error){
    console.error(error);
    showCallError("No se pudo conectar con Smart-Call.");
    return false;
  }
}

// ============================================================
// USUARIOS
// ============================================================

async function loadUsers(){
  try{
    const response = await fetch(`${API}/api/users/list/${encodeURIComponent(ME.username)}`, {
      headers: authHeaders()
    });

    if(response.status === 401 || response.status === 403){
      localStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      goAuth();
      return;
    }

    if(!response.ok){
      const data = await response.json().catch(() => ({}));
      throw new Error(data.detail || "Error cargando usuarios.");
    }

    const data = await response.json();
    const list = Array.isArray(data) ? data : (data.users || []);
    const box = document.getElementById("users");
    box.innerHTML = "";

    if(!list.length){
      box.innerHTML = '<div class="empty">No hay otros usuarios.</div>';
      return;
    }

    list.forEach(user => {
      const card = document.createElement("div");
      card.className = "user-card";

      const img = document.createElement("img");
      img.src = pfpUrl(user.pfp || user.profile_picture);
      img.onerror = () => img.src = "https://via.placeholder.com/44";

      const dot = document.createElement("div");
      dot.className = "status-dot " + (user.online ? "online" : "offline");

      const name = document.createElement("div");
      name.className = "user-name";
      name.textContent = "@" + user.username;

      const button = document.createElement("button");
      button.className = "call-btn";
      button.textContent = "📞";
      button.title = "Llamar";
      button.onclick = () => callUser(user.username);

      card.appendChild(img);
      card.appendChild(dot);
      card.appendChild(name);
      card.appendChild(button);
      box.appendChild(card);
    });
  }catch(error){
    console.error(error);
    document.getElementById("users").innerHTML = '<div class="empty">No se pudieron cargar los usuarios.</div>';
  }
}

// ============================================================
// SALAS
// ============================================================

async function loadRooms(){
  try{
    const response = await fetch(`${API}/api/rooms`, {
      headers: authHeaders()
    });

    if(response.status === 401 || response.status === 403){
      localStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      goAuth();
      return;
    }

    if(!response.ok){
      throw new Error("Error cargando salas.");
    }

    const data = await response.json();
    const list = Array.isArray(data) ? data : (data.rooms || []);
    const box = document.getElementById("rooms");
    box.innerHTML = "";

    if(!list.length){
      box.innerHTML = '<div class="empty">No hay salas todavía.</div>';
      return;
    }

    list.forEach(room => {
      const card = document.createElement("div");
      card.className = "room-card";

      const info = document.createElement("div");
      info.className = "room-info";

      const name = document.createElement("div");
      name.className = "room-name";
      name.textContent = room.name;

      const creator = document.createElement("div");
      creator.className = "room-creator";
      creator.textContent = "Creado por @" + (room.creator || "desconocido");

      const button = document.createElement("button");
      button.className = "primary-btn";
      button.textContent = "LLAMAR";
      button.onclick = () => joinRoom(room.name);

      info.appendChild(name);
      info.appendChild(creator);
      card.appendChild(info);
      card.appendChild(button);
      box.appendChild(card);
    });
  }catch(error){
    console.error(error);
    document.getElementById("rooms").innerHTML = '<div class="empty">No se pudieron cargar las salas.</div>';
  }
}

async function createRoom(){
  hideCallError();
  const input = document.getElementById("room");
  const name = input.value.trim();

  if(!name){
    showCallError("Escribe un nombre para el grupo.");
    return;
  }

  try{
    const response = await fetch(`${API}/api/rooms?name=${encodeURIComponent(name)}`, {
      method: "POST",
      headers: authHeaders()
    });

    const data = await response.json().catch(() => ({}));

    if(response.status === 401 || response.status === 403){
      localStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      goAuth();
      return;
    }

    if(!response.ok){
      showCallError(data.detail || "No se pudo crear el grupo.");
      return;
    }

    input.value = "";
    await loadRooms();
    await joinRoom(data.room || name);
  }catch(error){
    console.error(error);
    showCallError("No se pudo conectar con Smart-Call.");
  }
}

// ============================================================
// MEDIA
// ============================================================

async function initMedia(){
  if(localStream) return localStream;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showCallError("Tu navegador no permite usar cámara y micrófono desde esta página.");
    return null;
  }

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    applyTrackStates();

    addVideo(ME.username, localStream, true);
    return localStream;
  }catch(error){
    console.error(error);
    if(error.name === "NotAllowedError"){
      showCallError("Permite el acceso a la cámara y al micrófono para realizar la llamada.");
    }else{
      showCallError("No se pudo acceder a la cámara o al micrófono.");
    }
    return null;
  }
}

// ---------- Silenciar micrófono / ocultar cámara ----------

function applyTrackStates(){
  if(localStream){
    localStream.getAudioTracks().forEach(track => track.enabled = !micMuted);
    localStream.getVideoTracks().forEach(track => track.enabled = !camHidden);
  }
  refreshToggleButtons();
}

function refreshToggleButtons(){
  const mic = document.getElementById("micBtn");
  const cam = document.getElementById("camBtn");

  mic.textContent = micMuted ? "🔇" : "🎤";
  mic.title = micMuted ? "Activar micrófono" : "Silenciar micrófono";
  mic.classList.toggle("off", micMuted);

  cam.textContent = camHidden ? "🚫" : "📷";
  cam.title = camHidden ? "Mostrar cámara" : "Ocultar cámara";
  cam.classList.toggle("off", camHidden);
}

function toggleMic(){
  micMuted = !micMuted;
  applyTrackStates();
}

function toggleCam(){
  camHidden = !camHidden;
  applyTrackStates();
}

// ============================================================
// WEBRTC
// ============================================================

function createPeerConnection(username){
  const peer = new RTCPeerConnection({
    iceServers: ICE_SERVERS
  });

  if(localStream){
    localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
  }

  peer.ontrack = event => {
    if(event.streams && event.streams[0]){
      addVideo(username, event.streams[0], false);
    }
  };

  peer.onicecandidate = event => {
    if(!event.candidate) return;
    sendSocket({
      type: "ice",
      to: username,
      candidate: event.candidate
    });
  };

  peer.onconnectionstatechange = () => {
    const state = peer.connectionState;
    if(state === "failed" || state === "closed"){
      removePeer(username);
    }
  };

  peers[username] = peer;
  return peer;
}

async function createPeer(username, makeOffer){
  if(peers[username]) return peers[username];

  const stream = await initMedia();
  if(!stream) return null;

  const peer = createPeerConnection(username);

  if(makeOffer){
    try{
      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      sendSocket({
        type: "offer",
        to: username,
        offer: peer.localDescription
      });
    }catch(error){
      console.error("Error creando offer:", error);
      removePeer(username);
    }
  }

  return peer;
}

async function handleOffer(data){
  if(!data.from) return;

  showCallScreen("Llamada con @" + data.from);

  const peer = await createPeer(data.from, false);
  if(!peer) return;

  try{
    await peer.setRemoteDescription(new RTCSessionDescription(data.offer));

    const queued = pendingIce[data.from] || [];
    for(const candidate of queued){
      try{
        await peer.addIceCandidate(new RTCIceCandidate(candidate));
      }catch(error){
        console.error("ICE pendiente:", error);
      }
    }
    delete pendingIce[data.from];

    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);

    sendSocket({
      type: "answer",
      to: data.from,
      answer: peer.localDescription
    });
  }catch(error){
    console.error("Error procesando offer:", error);
    showCallError("No se pudo establecer la llamada.");
  }
}

async function handleAnswer(data){
  const peer = peers[data.from];
  if(!peer) return;

  try{
    await peer.setRemoteDescription(new RTCSessionDescription(data.answer));

    const queued = pendingIce[data.from] || [];
    for(const candidate of queued){
      try{
        await peer.addIceCandidate(new RTCIceCandidate(candidate));
      }catch(error){
        console.error("ICE pendiente:", error);
      }
    }
    delete pendingIce[data.from];
  }catch(error){
    console.error("Error procesando answer:", error);
  }
}

async function handleIce(data){
  if(!data.from || !data.candidate) return;

  const peer = peers[data.from];
  if(!peer || !peer.remoteDescription || !peer.remoteDescription.type){
    pendingIce[data.from] ||= [];
    pendingIce[data.from].push(data.candidate);
    return;
  }

  try{
    await peer.addIceCandidate(new RTCIceCandidate(data.candidate));
  }catch(error){
    console.error("Error agregando ICE:", error);
  }
}

// ============================================================
// VIDEOS
// ============================================================

function safeVideoId(username){
  return "video-" + String(username).replace(/[^a-zA-Z0-9_-]/g, "_");
}

function addVideo(username, stream, local){
  const id = safeVideoId(username);
  let box = document.getElementById(id);

  if(!box){
    box = document.createElement("div");
    box.className = "video-box";
    box.id = id;

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.muted = !!local;
    video.srcObject = stream;

    const label = document.createElement("div");
    label.className = "video-label";
    label.textContent = local ? "Tú" : "@" + username;

    box.appendChild(video);
    box.appendChild(label);
    document.getElementById("videos").appendChild(box);
  }else{
    const video = box.querySelector("video");
    if(video) video.srcObject = stream;
  }
}

function removePeer(username){
  if(peers[username]){
    try{ peers[username].close(); }catch(error){}
    delete peers[username];
  }
  delete pendingIce[username];

  const box = document.getElementById(safeVideoId(username));
  if(box) box.remove();
}

// ============================================================
// LLAMADAS
// ============================================================

function callUser(username){
  currentRoom = "";
  currentTarget = username;
  showCallScreen("Llamada con @" + username);
  hideCallError();
  startCurrentCall();
}

async function startCurrentCall(){
  hideCallError();

  if(!currentTarget && !currentRoom){
    showCallError("Selecciona un usuario o una sala primero.");
    return;
  }

  if(!ws || ws.readyState !== WebSocket.OPEN){
    showCallError("El servidor de llamadas no está conectado.");
    connectSocket(true);
    return;
  }

  const stream = await initMedia();
  if(!stream) return;

  if(currentTarget){
    await createPeer(currentTarget, true);
  }
}

async function joinRoom(room){
  hideCallError();

  if(!room) return;

  await endCall(false);

  currentRoom = room;
  currentTarget = "";
  showCallScreen("Grupo: " + room);

  if(!ws || ws.readyState !== WebSocket.OPEN){
    showCallError("El servidor de llamadas no está conectado.");
    connectSocket(true);
    return;
  }

  const stream = await initMedia();
  if(!stream) return;

  sendSocket({
    type: "join_room",
    room: room
  });
}

// ============================================================
// WEBSOCKET
// ============================================================

function wsUrl(){
  return API.replace(/^http:/, "ws:").replace(/^https:/, "wss:");
}

function sendSocket(data){
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify(data));
  }
}

function connectSocket(retryOnFailure=false){
  if(!ME || !TOKEN) return;
  if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  stopReconnect();

  try{
    ws = new WebSocket(`${wsUrl()}/ws/${encodeURIComponent(ME.username)}?token=${encodeURIComponent(TOKEN)}`);
  }catch(error){
    console.error(error);
    if(retryOnFailure) scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    console.log("Smart-Call conectado.");

    if(currentRoom){
      sendSocket({
        type: "join_room",
        room: currentRoom
      });
    }
  };

  ws.onmessage = async event => {
    try{
      const data = JSON.parse(event.data);

      switch(data.type){
        case "room_users":
          if(data.room !== currentRoom) break;
          for(const username of (data.users || [])){
            if(username === ME.username) continue;
            await createPeer(username, true);
          }
          break;

        case "room_user_joined":
          if(data.room === currentRoom && data.username !== ME.username){
            // El usuario que ya estaba dentro espera el offer del recién llegado.
            await createPeer(data.username, false);
          }
          break;

        case "room_user_left":
          if(data.room === currentRoom){
            removePeer(data.username);
          }
          break;

        case "offer":
          if(!currentRoom && !currentTarget){
            currentTarget = data.from || "";
          }
          await handleOffer(data);
          break;

        case "answer":
          await handleAnswer(data);
          break;

        case "ice":
          await handleIce(data);
          break;

        case "end_call":
          removePeer(data.from);
          if(Object.keys(peers).length === 0 && !currentRoom){
            showProfile();
          }
          break;

        case "error":
          showCallError(data.message || "Error del servidor.");
          break;

        case "pong":
          break;
      }
    }catch(error){
      console.error("Error WebSocket:", error);
    }
  };

  ws.onclose = event => {
    console.log("Smart-Call desconectado.");
    ws = null;

    // 4401 = token inválido
    if(event && event.code === 4401){
      localStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      goAuth();
      return;
    }

    if(TOKEN && ME) scheduleReconnect();
  };

  ws.onerror = error => {
    console.error("WebSocket:", error);
    if(retryOnFailure) scheduleReconnect();
  };
}

function scheduleReconnect(){
  if(reconnecting || !TOKEN || !ME) return;
  reconnecting = true;
  reconnectTimer = setTimeout(() => {
    reconnecting = false;
    reconnectTimer = null;
    connectSocket();
  }, WS_RECONNECT_MS);
}

setInterval(() => {
  if(ws && ws.readyState === WebSocket.OPEN){
    try{ ws.send("ping"); }catch(error){}
  }
}, WS_PING_MS);

// ============================================================
// COLGAR / LOGOUT
// ============================================================

async function endCall(returnToProfile=true){
  for(const username of Object.keys(peers)){
    sendSocket({
      type: "end_call",
      to: username
    });
    try{ peers[username].close(); }catch(error){}
  }

  peers = {};
  pendingIce = {};

  if(localStream){
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  // La próxima llamada empieza con micrófono y cámara activos
  micMuted = false;
  camHidden = false;
  refreshToggleButtons();

  document.getElementById("videos").innerHTML = "";

  if(currentRoom){
    sendSocket({
      type: "leave_room",
      room: currentRoom
    });
  }

  currentTarget = "";
  currentRoom = "";
  hideCallError();

  if(returnToProfile){
    showProfile();
  }
}

async function logout(){
  try{
    await endCall(false);
    if(ws){
      try{ ws.close(); }catch(error){}
      ws = null;
    }

    await fetch(`${API}/api/logout`, {
      method: "POST",
      headers: authHeaders()
    });
  }catch(error){
    console.error(error);
  }

  localStorage.removeItem(TOKEN_KEY);
  TOKEN = "";
  ME = null;
  goAuth();
}

// ============================================================
// BANNERS
// ============================================================

// Se guarda por usuario en este navegador:
//   smartcall_banner_<usuario>         -> "banner1.png" | "custom" | ""
//   smartcall_banner_<usuario>_custom  -> foto personalizada (data URL)

function bannerKey(){
  return BANNER_STORAGE_PREFIX + (ME?.username || "");
}

function storageGet(key){
  try{ return localStorage.getItem(key) || ""; }
  catch(error){ return ""; }
}

function storageSet(key, value){
  try{
    if(value) localStorage.setItem(key, value);
    else localStorage.removeItem(key);
    return true;
  }catch(error){
    return false;
  }
}

function applyBanner(src){
  const center = document.getElementById("center");

  if(!src){
    center.style.backgroundImage = "";
    return;
  }

  center.style.backgroundImage =
    `linear-gradient(rgba(20,24,30,${BANNER_DIM}),rgba(20,24,30,${BANNER_DIM})), url("${src}")`;
}

function currentBannerSrc(){
  const choice = storageGet(bannerKey());
  if(choice === "custom") return storageGet(bannerKey() + "_custom");
  return choice;
}

function renderBannerGrid(){
  const grid = document.getElementById("bannerGrid");
  const choice = storageGet(bannerKey());
  const custom = storageGet(bannerKey() + "_custom");

  grid.innerHTML = "";

  const addOption = (label, preview, value) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "banner-opt" + (choice === value ? " active" : "");

    if(preview){
      const img = document.createElement("img");
      img.src = preview;
      img.alt = label;
      img.onerror = () => {
        img.onerror = null;
        const missing = document.createElement("div");
        missing.className = "banner-none";
        missing.textContent = "No encontrado";
        img.replaceWith(missing);
      };
      button.appendChild(img);
    }else{
      const none = document.createElement("div");
      none.className = "banner-none";
      none.textContent = "Fondo gris";
      button.appendChild(none);
    }

    const text = document.createElement("div");
    text.textContent = label;
    button.appendChild(text);

    button.onclick = () => selectBanner(value);
    grid.appendChild(button);
  };

  BANNERS.forEach(banner => addOption(banner.name, banner.file, banner.file));

  if(custom) addOption("Mi foto", custom, "custom");

  addOption("Sin banner", "", "");
}

function selectBanner(value){
  storageSet(bannerKey(), value);
  applyBanner(currentBannerSrc());
  renderBannerGrid();
}

function openBannerModal(){
  renderBannerGrid();
  document.getElementById("bannerModal").classList.add("show");
}

function closeBannerModal(){
  document.getElementById("bannerModal").classList.remove("show");
}

function fileToBannerData(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));

    reader.onload = () => {
      const img = new Image();

      img.onerror = () => reject(new Error("El archivo no es una imagen válida."));

      img.onload = () => {
        // Reduce la foto para que quepa en el almacenamiento del navegador
        const scale = Math.min(1, CUSTOM_BANNER_MAX_SIDE / Math.max(img.width, img.height));

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", CUSTOM_BANNER_QUALITY));
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

async function uploadBanner(file){
  if(!file) return;

  if(!file.type.startsWith("image/")){
    showToast("Elige una imagen (JPG, PNG, WEBP...).");
    return;
  }

  try{
    const data = await fileToBannerData(file);

    if(!storageSet(bannerKey() + "_custom", data)){
      showToast("La foto es demasiado grande para guardarla.");
      return;
    }

    selectBanner("custom");
    showToast("Banner actualizado.");
  }catch(error){
    showToast(error.message);
  }
}

document.getElementById("bannerOpenBtn").onclick = openBannerModal;
document.getElementById("bannerCloseBtn").onclick = closeBannerModal;

document.getElementById("bannerModal").addEventListener("click", event => {
  if(event.target.id === "bannerModal") closeBannerModal();
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closeBannerModal();
});

document.getElementById("bannerUploadBtn").onclick = () =>
  document.getElementById("bannerFileInput").click();

document.getElementById("bannerFileInput").addEventListener("change", event => {
  const file = event.target.files?.[0];
  if(file) uploadBanner(file);
  event.target.value = "";
});

// ============================================================
// INICIO
// ============================================================

async function start(){
  const valid = await loadMe();
  if(!valid) return;

  document.getElementById("app").style.display = "grid";

  applyBanner(currentBannerSrc());

  await Promise.all([
    loadUsers(),
    loadRooms()
  ]);

  connectSocket();
}

start();
</script>
