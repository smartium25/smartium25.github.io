<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Chat · 3PD</title>
<script src="./url.js"></script>
<script>
/* Expone URLS en window y recoge/sincroniza el Smart-Token (URL o almacenamiento) */
(function(){try{window.URLS=URLS;var u=new URL(location.href),h=new URLSearchParams(u.hash.slice(1)),K=['smart_token','smart_account_token','knfoundation_token'],t=u.searchParams.get('token')||h.get('token');for(var i=0;!t&&i<K.length;i++)t=localStorage.getItem(K[i]);if(t){t=String(t).replace(/^"|"$/g,'').trim();K.forEach(function(k){localStorage.setItem(k,t)})}if(u.searchParams.has('token')||h.has('token')){u.searchParams.delete('token');h.delete('token');u.hash=h.toString();history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}})();
</script>
<script>
// ---- CONFIGURACIÓN (las URLs se cambian en url.js) ----
const API=URLS.chat, KN_AUTH_API=URLS.account, AUTH_URL=URLS.auth, TOKEN_KEY="smart_token";
const BANNERS=[{name:"Logo Original",file:"banner 1.JPG"},{name:"Logo Moderno",file:"banner 2.JPG"},{name:"I ❤️ Smart-Chat",file:"banner 3.JPG"}];
const BANNER_DIM=0.35, CUSTOM_BANNER_MAX_SIDE=1600, CUSTOM_BANNER_QUALITY=0.82, BANNER_STORAGE_PREFIX="smartchat_banner_";
const USERS_REFRESH_MS=10000, WS_RECONNECT_MS=3000;
</script>
<style>
:root{--bg:#252a33;--panel:#272d37;--card:#303640;--cyan:#00f0ff;--text:#f5f7fa;--muted:#9aa4b2;--green:#35d06f;--red:#ff5b67;--border:#3b424d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
/* El banner se pinta en TODA la pantalla (body); los paneles son translúcidos */
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg) center/cover no-repeat fixed;color:var(--text)}
button,input{font:inherit}button{border:0;cursor:pointer}
.app{width:100%;height:100vh;display:grid;grid-template-columns:minmax(220px,1fr) minmax(420px,1.42fr) minmax(220px,1fr)}
.panel{background:rgba(39,45,55,.8);backdrop-filter:blur(6px);padding:16px;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.panel:last-child{border-right:0;border-left:1px solid var(--border)}
.title{color:var(--cyan);background:var(--card);border-radius:12px;padding:12px 14px;text-align:center;font-weight:700;margin-bottom:12px}
.title.white{color:var(--text)}
.scroll{flex:1;min-height:0;overflow:auto;padding-right:2px}
.scroll::-webkit-scrollbar,.chat-messages::-webkit-scrollbar,.member-list::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb,.chat-messages::-webkit-scrollbar-thumb,.member-list::-webkit-scrollbar-thumb{background:#46505c;border-radius:9px}
.user-card{background:var(--card);border-radius:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;padding:10px}
.user-card:hover,.member-card:hover,.group-card:hover{background:#353c47}
.user-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);flex:none;background:#171b21}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none}.status-dot.online{background:var(--green)}.status-dot.offline{background:#68707b}
.user-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chat-btn,.primary-btn{background:var(--cyan);color:#081013;font-weight:700;border-radius:9px;padding:9px 11px}
.chat-btn:hover,.primary-btn:hover{background:#5ff6ff}
.full{width:100%}
.center{background:transparent;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#profile{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.big-pfp{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--cyan);background:#171b21;margin-bottom:18px}
.profile-name{font-size:22px;font-weight:700;margin-bottom:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.profile-sub{color:#dfe5ec;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.logout-btn,.banner-open-btn,.secondary-btn{background:#454c57;color:#fff;border-radius:9px;padding:10px 18px;font-weight:700}
.logout-btn{margin-top:18px}.banner-open-btn{margin-top:10px}
.logout-btn:hover,.banner-open-btn:hover,.secondary-btn:hover{background:#515a66}
#chat{display:none;width:100%;height:100%;flex-direction:column;min-height:0}
.chat-head{padding:13px 15px;background:rgba(48,54,64,.9);color:var(--cyan);font-weight:700;display:flex;align-items:center;gap:10px;flex:none}
.chat-head img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#171b21;flex:none}
.chat-head-text{min-width:0}.chat-head-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head-sub{color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}
.chat-messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px}
.message{max-width:76%;background:rgba(48,54,64,.92);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.4;align-self:flex-start;word-break:break-word}
.message.mine{align-self:flex-end;background:rgba(10,64,71,.95);border:1px solid rgba(0,240,255,.25)}
.message-sender{color:var(--cyan);font-size:11px;font-weight:700;margin-bottom:4px}
.message-meta{color:var(--muted);font-size:10px;margin-top:5px}
.media{display:block;width:auto;max-width:100%;max-height:300px;border-radius:9px;margin-top:6px}
.chat-compose{display:flex;align-items:center;gap:9px;padding:12px 14px;background:rgba(48,54,64,.9);flex:none}
input{width:100%;background:#1e232b;color:var(--text);border:1px solid #434b56;border-radius:9px;padding:11px 12px;outline:none;margin-bottom:9px}
input:focus{border-color:var(--cyan)}
.chat-compose input{min-width:0;margin:0}
.file-btn{background:#454c57;color:#fff;border-radius:9px;width:42px;height:42px;flex:none}.file-btn:hover{background:#515a66}
.send-btn{background:var(--cyan);color:#081013;font-weight:700;border-radius:9px;padding:10px 14px;flex:none}
.member-list{flex:0 0 auto;max-height:32vh;overflow:auto;margin-bottom:10px}
.member-card{background:var(--card);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:9px;padding:8px}
.member-card img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#171b21;flex:none}
.member-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}
.member-card input{width:16px;height:16px;margin:0;accent-color:var(--cyan)}
.groups-title{margin-top:14px}
.group-card{background:var(--card);border-radius:12px;margin-bottom:10px;padding:11px 86px 11px 12px;min-height:66px;position:relative;display:flex;align-items:center}
.group-info{width:100%;min-width:0}.group-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-sub{margin-top:4px;font-size:12px;color:var(--muted)}
.group-card .chat-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.empty{color:var(--muted);font-size:13px;padding:8px 2px;text-align:center}
.chat-error{display:none;margin:12px 14px 0;padding:10px 12px;border-radius:10px;background:#3b2428;color:#ffafb5;border:1px solid #70434a;font-size:13px;flex:none}
.status-message{position:absolute;left:14px;bottom:7px;color:#c4cad2;font-size:10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2128;border:1px solid #414954;color:#fff;padding:9px 13px;border-radius:9px;font-size:12px;display:none;z-index:20}.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}
.modal-card{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.banner-opt{background:var(--card);border:2px solid transparent;border-radius:12px;padding:6px;color:var(--text);text-align:center;font-size:12px;font-weight:600}
.banner-opt:hover{background:#353c47}.banner-opt.active{border-color:var(--cyan)}
.banner-opt img,.banner-opt .banner-none{display:block;width:100%;height:80px;object-fit:cover;border-radius:8px;margin-bottom:6px;background:#21262e}
.banner-opt .banner-none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.banner-actions{display:flex;gap:9px;flex-wrap:wrap}.banner-actions button{flex:1;min-width:120px}
@media(max-width:900px){.app{grid-template-columns:220px 1fr}.app>.panel:last-child{display:none}}
@media(max-width:600px){.app{grid-template-columns:1fr}.app>.panel:first-child{display:none}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
 <aside class="panel"><div class="title">Usuarios</div><div class="scroll" id="users"></div></aside>
 <main class="center" id="center">
  <section id="profile">
   <img id="mypfp" class="big-pfp" src="https://via.placeholder.com/150" alt="Foto de perfil">
   <div id="me" class="profile-name"></div>
   <div class="profile-sub">Selecciona a alguien para iniciar un chat</div>
   <button class="logout-btn" onclick="logout()">LOG OUT</button>
   <button id="bannerOpenBtn" class="banner-open-btn" type="button">🎨 BANNER</button>
  </section>
  <section id="chat">
   <div class="chat-head"><img id="chatPfp" src="https://via.placeholder.com/44" alt="Foto"><div class="chat-head-text"><div id="chatTitle" class="chat-head-title">Chat</div><div id="chatSub" class="chat-head-sub">Chat privado</div></div></div>
   <div id="chatError" class="chat-error"></div>
   <div id="messages" class="chat-messages"></div>
   <div class="chat-compose">
    <button id="fileBtn" class="file-btn" title="Adjuntar archivo" type="button">📎</button>
    <input id="fileInput" type="file" hidden accept="image/*,video/*">
    <input id="message" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
    <button id="sendBtn" class="send-btn" type="button">Enviar</button>
   </div>
  </section>
  <div id="statusMessage" class="status-message"></div>
 </main>
 <aside class="panel">
  <div class="title">Crear Grupo</div>
  <input id="groupName" placeholder="Nombre grupo" maxlength="80" autocomplete="off">
  <div id="membersList" class="member-list"></div>
  <button id="createGroupBtn" class="primary-btn full" type="button">Crear Grupo</button>
  <div class="title groups-title white">Mis Grupos</div>
  <div id="groupsList" class="scroll"></div>
 </aside>
</div>

<div id="bannerModal" class="modal"><div class="modal-card">
 <div class="title">Elige tu banner</div><div id="bannerGrid" class="banner-grid"></div>
 <input id="bannerFileInput" type="file" accept="image/*" hidden>
 <div class="banner-actions"><button id="bannerUploadBtn" class="primary-btn" type="button">📷 Subir mi foto</button><button id="bannerCloseBtn" class="secondary-btn" type="button">Cerrar</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
let TOKEN=localStorage.getItem(TOKEN_KEY)||"", ME=null, currentTarget="", currentType="", ws=null, usersCache=[], toastTimer=null, reconnectTimer=null, redirecting=false;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function toast(m){const b=$("toast");b.textContent=m||"Ocurrió un error.";b.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.remove("show"),2800)}
function showChatError(m){const b=$("chatError");b.textContent=m||"Ocurrió un error.";b.style.display="block"}
function hideChatError(){$("chatError").style.display="none"}
function pfpUrl(v){if(!v)return"https://via.placeholder.com/44";if(/^https?:/.test(v))return v;return KN_AUTH_API+(v.startsWith("/")?v:"/"+v)}
function fallback(img,s=44){img.onerror=()=>{img.onerror=null;img.src="https://via.placeholder.com/"+s}}
function goAuth(){if(redirecting)return;redirecting=true;location.replace(AUTH_URL+(AUTH_URL.includes("?")?"&":"?")+"redirect="+encodeURIComponent(location.origin+location.pathname))}
/* Llamada a la API: añade el Smart-Token y manda al login si la sesión caduca */
async function api(path,opt={}){
 const r=await fetch(API+path,{...opt,headers:{Authorization:"Smart-Token "+TOKEN,...(opt.headers||{})}});
 if(r.status===401||r.status===403){["smart_token","smart_account_token","knfoundation_token"].forEach(k=>localStorage.removeItem(k));TOKEN="";goAuth();throw new Error("redirect")}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.detail||"Error "+r.status);return d}

async function loadMe(){
 if(!TOKEN){goAuth();return false}
 try{const d=await api("/api/me");ME=d.user||d;if(!ME||!ME.username){goAuth();return false}
  $("me").textContent="@"+ME.username;const i=$("mypfp");i.src=pfpUrl(ME.pfp||ME.profile_picture);fallback(i,150);return true}
 catch(e){if(e.message!=="redirect")showChatError("No se pudo conectar con Smart-Chat.");return false}}

async function loadUsers(){
 try{const d=await api("/api/users/list/"+encodeURIComponent(ME.username)),list=Array.isArray(d)?d:(d.users||[]);
  usersCache=list.filter(u=>u&&u.username&&u.username!==ME.username);
  const box=$("users"),mem=$("membersList");box.innerHTML="";mem.innerHTML="";
  if(!usersCache.length){box.innerHTML='<div class="empty">No hay otros usuarios.</div>';mem.innerHTML='<div class="empty">No hay usuarios.</div>';return}
  usersCache.forEach(u=>{
   const c=el("div","user-card"),img=el("img");img.src=pfpUrl(u.pfp||u.profile_picture);fallback(img,44);
   const b=el("button","chat-btn","Chat");b.onclick=()=>openPrivate(u.username);
   c.append(img,el("div","status-dot "+(u.online?"online":"offline")),el("div","user-name","@"+u.username),b);box.appendChild(c);
   const m=el("label","member-card"),mi=el("img");mi.src=pfpUrl(u.pfp||u.profile_picture);fallback(mi,38);
   const cb=el("input");cb.type="checkbox";cb.value=u.username;m.append(mi,el("div","member-name","@"+u.username),cb);mem.appendChild(m)})}
 catch(e){if(e.message==="redirect")return;$("users").innerHTML='<div class="empty">No se pudieron cargar los usuarios.</div>'}}

function showChat(title,sub,pfp){
 $("profile").style.display="none";$("chat").style.display="flex";
 $("chatTitle").textContent=title;$("chatSub").textContent=sub;const i=$("chatPfp");i.src=pfp;fallback(i,44);hideChatError();loadMessages()}
function openPrivate(name){currentTarget=name;currentType="private";const u=usersCache.find(x=>x.username===name);
 showChat("@"+name,u&&u.online?"En línea":"Desconectado",pfpUrl(u&&(u.pfp||u.profile_picture)))}
function openGroup(name){currentTarget=name;currentType="group";showChat(name,"Grupo","https://via.placeholder.com/44")}

async function loadMessages(){
 if(!currentTarget)return;const box=$("messages");
 const path=(currentType==="group"?"/api/groups/get/":"/api/chat/get/")+encodeURIComponent(ME.username)+"/"+encodeURIComponent(currentTarget);
 try{const d=await api(path);renderMessages(Array.isArray(d)?d:(d.messages||[]))}
 catch(e){if(e.message!=="redirect")box.innerHTML='<div class="empty">No se pudieron cargar los mensajes.</div>'}}
function renderMessages(list){
 const box=$("messages");box.innerHTML="";
 if(!list.length){box.innerHTML='<div class="empty">No hay mensajes todavía.</div>';return}
 list.forEach(m=>{
  const w=el("div","message"+(m.sender===ME.username?" mine":""));
  if(currentType==="group"&&m.sender&&m.sender!==ME.username)w.appendChild(el("div","message-sender","@"+m.sender));
  if(m.message)w.appendChild(el("div",null,m.message));
  if(m.file){const url=API+"/media/chat/"+encodeURIComponent(m.file);
   if(m.type==="image"){const i=el("img","media");i.src=url;i.alt="Imagen";w.appendChild(i)}
   else if(m.type==="video"){const v=el("video","media");v.src=url;v.controls=true;v.playsInline=true;w.appendChild(v)}}
  w.appendChild(el("div","message-meta",m.date||""));box.appendChild(w)});
 box.scrollTop=box.scrollHeight}

async function sendMessage(){
 const input=$("message"),text=input.value.trim();if(!currentTarget||!text)return;
 const group=currentType==="group";
 try{await api(group?"/api/groups/send":"/api/chat/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(group?{group:currentTarget,message:text}:{receiver:currentTarget,message:text})});
  input.value="";await loadMessages()}catch(e){if(e.message!=="redirect")toast(e.message)}}
async function sendFile(file){
 if(!currentTarget||!file)return;const f=new FormData();f.append("receiver",currentTarget);f.append("file",file);
 try{await api(currentType==="group"?"/api/groups/upload":"/api/chat/upload",{method:"POST",body:f});await loadMessages()}catch(e){if(e.message!=="redirect")toast(e.message)}}

async function loadGroups(){
 try{const d=await api("/api/groups/list/"+encodeURIComponent(ME.username)),gs=Array.isArray(d)?d:(d.groups||[]),box=$("groupsList");box.innerHTML="";
  if(!gs.length){box.innerHTML='<div class="empty">No estás en ningún grupo.</div>';return}
  gs.forEach(g=>{const c=el("div","group-card"),info=el("div","group-info");info.append(el("div","group-name",g.name),el("div","group-sub","Grupo"));
   const b=el("button","chat-btn","Chat");b.onclick=()=>openGroup(g.name);c.append(info,b);box.appendChild(c)})}
 catch(e){if(e.message!=="redirect")$("groupsList").innerHTML='<div class="empty">No se pudieron cargar los grupos.</div>'}}
async function createGroup(){
 const input=$("groupName"),name=input.value.trim();if(!name){toast("Escribe un nombre para el grupo.");input.focus();return}
 const sel=[...document.querySelectorAll('#membersList input:checked')].map(c=>c.value),f=new FormData();f.append("name",name);f.append("members",sel.join(","));
 try{await api("/api/groups/create",{method:"POST",body:f});input.value="";document.querySelectorAll('#membersList input').forEach(c=>c.checked=false);await loadGroups();openGroup(name);toast("Grupo creado.")}
 catch(e){if(e.message!=="redirect")toast(e.message)}}

function connectWebSocket(){
 if(ws){try{ws.close()}catch{}}
 if(!ME||!TOKEN)return;
 ws=new WebSocket(API.replace(/^https:/,"wss:").replace(/^http:/,"ws:")+"/ws/"+encodeURIComponent(ME.username)+"?token="+encodeURIComponent(TOKEN));
 ws.onopen=()=>{$("statusMessage").textContent=""};
 ws.onmessage=async()=>{if(currentTarget){try{await loadMessages()}catch{}}try{await loadUsers()}catch{}};
 ws.onclose=()=>{clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{if(TOKEN&&ME)connectWebSocket()},WS_RECONNECT_MS)};
 ws.onerror=()=>{$("statusMessage").textContent="WebSocket desconectado"}}

async function logout(){
 try{await fetch(API+"/api/logout",{method:"POST",headers:{Authorization:"Smart-Token "+TOKEN}})}catch(e){}
 if(ws){try{ws.close()}catch{}}
 ["smart_token","smart_account_token","knfoundation_token"].forEach(k=>localStorage.removeItem(k));TOKEN="";goAuth()}

/* ---------- Banners (ocupan toda la pantalla) ---------- */
const bannerKey=()=>BANNER_STORAGE_PREFIX+(ME&&ME.username||"");
const sget=k=>{try{return localStorage.getItem(k)||""}catch{return""}};
function sset(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch{return false}}
function applyBanner(src){
 document.body.style.backgroundImage=src?`linear-gradient(rgba(20,24,30,${BANNER_DIM}),rgba(20,24,30,${BANNER_DIM})), url("${src}")`:""}
function currentBannerSrc(){const c=sget(bannerKey());return c==="custom"?sget(bannerKey()+"_custom"):c}
function renderBannerGrid(){
 const grid=$("bannerGrid"),choice=sget(bannerKey()),custom=sget(bannerKey()+"_custom");grid.innerHTML="";
 const add=(label,preview,value)=>{
  const b=el("button","banner-opt"+(choice===value?" active":""));b.type="button";
  if(preview){const i=el("img");i.src=preview;i.alt=label;i.onerror=()=>{i.onerror=null;i.replaceWith(el("div","banner-none","No encontrado"))};b.appendChild(i)}
  else b.appendChild(el("div","banner-none","Fondo gris"));
  b.appendChild(el("div",null,label));b.onclick=()=>selectBanner(value);grid.appendChild(b)};
 BANNERS.forEach(x=>add(x.name,x.file,x.file));if(custom)add("Mi foto",custom,"custom");add("Sin banner","","")}
function selectBanner(v){sset(bannerKey(),v);applyBanner(currentBannerSrc());renderBannerGrid()}
function fileToBannerData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("No se pudo leer la imagen."));
 r.onload=()=>{const img=new Image();img.onerror=()=>no(new Error("El archivo no es una imagen válida."));
  img.onload=()=>{const s=Math.min(1,CUSTOM_BANNER_MAX_SIDE/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",CUSTOM_BANNER_QUALITY))};img.src=r.result};r.readAsDataURL(file)})}
async function uploadBanner(file){
 if(!file)return;if(!file.type.startsWith("image/"))return toast("Elige una imagen (JPG, PNG, WEBP...).");
 try{const d=await fileToBannerData(file);if(!sset(bannerKey()+"_custom",d))return toast("La foto es demasiado grande para guardarla.");selectBanner("custom");toast("Banner actualizado.")}catch(e){toast(e.message)}}

$("sendBtn").onclick=sendMessage;
$("message").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}});
$("fileBtn").onclick=()=>$("fileInput").click();
$("fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)sendFile(f);e.target.value=""});
$("createGroupBtn").onclick=createGroup;
$("bannerOpenBtn").onclick=()=>{renderBannerGrid();$("bannerModal").classList.add("show")};
$("bannerCloseBtn").onclick=()=>$("bannerModal").classList.remove("show");
$("bannerModal").addEventListener("click",e=>{if(e.target.id==="bannerModal")e.target.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("bannerModal").classList.remove("show")});
$("bannerUploadBtn").onclick=()=>$("bannerFileInput").click();
$("bannerFileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)uploadBanner(f);e.target.value=""});

(async function(){
 if(!(await loadMe()))return;
 $("app").style.display="grid";applyBanner(currentBannerSrc());
 await loadUsers();await loadGroups();connectWebSocket();
 setInterval(()=>{if(TOKEN&&ME)loadUsers().catch(()=>{})},USERS_REFRESH_MS)})();
</script>
</body>
