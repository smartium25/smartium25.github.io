<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Smart-Sound</title>
<script src="./url.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
// ==========================================================
// CONFIGURACIÓN
// ==========================================================
const API = URLS.sound;
const KN_AUTH_API = URLS.account;
const AUTH_URL = URLS.auth;
const TOKEN_KEY = "smart_token";
const SEARCH_DELAY_MS = 250;
const AUDIO_EXTENSIONS = [".mp3", ".wav", ".ogg", ".opus", ".flac", ".m4a", ".aac", ".webm"];
const DEFAULT_MAX_TRACK_BYTES = 200 * 1024 * 1024;
const COVER_EXTENSIONS = [".jpg", ".jpeg", ".png", ".webp"];
const MAX_COVER_BYTES = 5 * 1024 * 1024;
const VOLUME_KEY = "smartsound_volume";
const GENRES = ["Pop", "Hip hop / Rap", "Rock", "Electrónica", "Música latina", "Jazz"];
const GENRE_COLORS = {
  "Pop": ["#ff6fa5", "#c13584"],
  "Hip hop / Rap": ["#434343", "#000000"],
  "Rock": ["#e5533d", "#7a1d12"],
  "Electrónica": ["#36d1dc", "#5b86e5"],
  "Música latina": ["#f7b733", "#fc4a1a"],
  "Jazz": ["#7f5a83", "#0d324d"]
};
</script>
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f5f7;
  --line: #e5e5ea;
  --text: #1d1d1f;
  --muted: #86868b;
  --accent: #007aff;
  --accent-dark: #0062cc;
  --danger: #ff3b30;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; cursor: pointer; background: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: 56px minmax(0,1fr) 78px; width: 100%; height: 100vh; height: 100dvh; }

/* ---------- Barra superior (estilo iTunes) ---------- */
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 14px; background: #fff; border-bottom: 1px solid var(--line); }
.tb-left, .tb-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-right { justify-content: flex-end; }
.navbtns { display: flex; border: 1px solid #d2d2d7; border-radius: 7px; overflow: hidden; }
.navbtns button { width: 34px; height: 30px; font-size: 17px; color: #444; background: #fff; }
.navbtns button + button { border-left: 1px solid #d2d2d7; }
.navbtns button:hover:not(:disabled) { background: var(--surface); }
.src { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid #d2d2d7; border-radius: 7px; font-size: 15px; background: #fff; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 5px 16px; border-radius: 6px; font-size: 15px; color: var(--text); }
.tab:hover:not(.active) { background: var(--surface); }
.tab.active { background: var(--accent); color: #fff; }
.search-box { position: relative; }
.search-box input { width: 190px; height: 30px; padding: 0 10px 0 28px; border: 1px solid #d2d2d7; border-radius: 7px; background: var(--surface); font-size: 13px; outline: none; }
.search-box input:focus { border-color: var(--accent); background: #fff; }
.search-box::before { content: "⌕"; position: absolute; left: 9px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 15px; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #444; }
.me img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--surface); }
.me-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn { color: var(--accent); font-size: 13px; }
.link-btn:hover { text-decoration: underline; }

/* ---------- Contenido ---------- */
.main { overflow: auto; background: #fff; }
.banner { display: flex; align-items: center; justify-content: center; gap: 28px; height: 120px; padding: 0 20px; color: #fff; cursor: pointer; background: linear-gradient(90deg, #c4638f 0%, #9a7fc0 55%, #6a96ee 100%); }
.banner-logo { font-size: 30px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.banner-text { font-size: 31px; font-weight: 300; }
.page { padding: 0 60px 50px; }
.page-title { margin-top: 44px; font-size: 40px; font-weight: 800; letter-spacing: -.04em; }
.page-sub { margin-top: 6px; color: var(--muted); font-size: 14px; }
.rule { height: 1px; margin: 14px 0 24px; background: var(--line); }
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.section-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.section-head span { color: var(--muted); font-size: 13px; }
.muted-note { color: var(--muted); font-size: 14px; padding: 18px 0; }

/* Carruseles */
.car { position: relative; }
.car-track { display: flex; gap: 30px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.car-track::-webkit-scrollbar { display: none; }
.car-btn { position: absolute; top: 50%; z-index: 4; width: 38px; height: 38px; border-radius: 50%; background: #ffffffe6; box-shadow: 0 2px 10px #0003; font-size: 20px; display: none; place-items: center; transform: translateY(-50%); }
.car:hover .car-btn { display: grid; }
.car-btn.l { left: -14px; } .car-btn.r { right: -14px; }

.art { position: relative; display: grid; place-items: center; overflow: hidden; color: #ffffffaa; font-size: 34px; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.big { flex: none; width: calc((100% - 60px) / 3); min-width: 270px; scroll-snap-align: start; cursor: pointer; }
.big-label { color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.big-title { font-size: 26px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big-artist { font-size: 26px; line-height: 1.25; color: #9a9aa0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; }
.bigart { width: 100%; aspect-ratio: 780 / 450; border-radius: 6px; box-shadow: 0 4px 16px #0002; }
.bigart .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 22px 18px; color: #fff; font-size: 16px; text-align: left; background: linear-gradient(transparent, #000a); }
.playfab { position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 50%; background: #ffffffe0; color: #111; font-size: 17px; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.big:hover .playfab, .small:hover .playfab { opacity: 1; }
.small { flex: none; width: 176px; scroll-snap-align: start; cursor: pointer; }
.small .art { width: 176px; height: 176px; border-radius: 8px; box-shadow: 0 3px 12px #0002; }
.small .playfab { top: auto; bottom: 10px; right: 10px; width: 38px; height: 38px; }
.s-title { margin-top: 9px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-sub { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-new { color: var(--accent); font-size: 11px; font-weight: 700; margin-top: 2px; }

.genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
.genre { position: relative; height: 112px; padding: 16px; border-radius: 10px; color: #fff; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.genre b { font-size: 20px; letter-spacing: -.02em; }
.genre small { opacity: .85; font-size: 12px; margin-top: 3px; }
.genre .rank { position: absolute; top: 8px; right: 14px; font-size: 44px; font-weight: 900; opacity: .25; }
.genre:hover { filter: brightness(1.08); }

/* Tablas de canciones */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar input, .toolbar select { height: 32px; padding: 0 10px; border: 1px solid #d2d2d7; border-radius: 7px; background: var(--surface); font-size: 13px; outline: none; }
.toolbar input { flex: 1; max-width: 340px; }
.toolbar .count { margin-left: auto; color: var(--muted); font-size: 13px; }
.thead, .row { display: grid; grid-template-columns: 34px minmax(160px,2fr) minmax(100px,1.2fr) minmax(100px,1.2fr) minmax(90px,.9fr) 56px 104px; align-items: center; gap: 12px; padding: 0 10px; }
.thead { height: 30px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.row { min-height: 54px; border-bottom: 1px solid #f0f0f3; cursor: pointer; font-size: 13px; }
.row:nth-child(even) { background: #fafafc; }
.row:hover { background: #eef5ff; }
.row.playing { background: #e3efff; }
.row.playing .r-title { color: var(--accent); }
.r-idx { color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.r-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
.r-main .art { width: 38px; height: 38px; border-radius: 4px; flex: none; font-size: 15px; }
.r-title, .r-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-title { font-weight: 500; }
.r-cell { color: #555; }
.r-time { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.r-act { display: flex; justify-content: flex-end; gap: 2px; }
.ibtn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 15px; }
.ibtn:hover { background: #007aff1a; }
.ibtn.del { color: var(--danger); } .ibtn.del:hover { background: #ff3b3018; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; color: var(--muted); text-align: center; gap: 14px; line-height: 1.6; }
.empty::before { content: "♫"; display: grid; place-items: center; width: 70px; height: 70px; border-radius: 18px; background: var(--surface); color: #c0c0c6; font-size: 34px; }

/* Detalle de canción (estilo álbum de iTunes) */
.detail { display: grid; grid-template-columns: minmax(220px, 510px) minmax(0,1fr); gap: 66px; padding-top: 60px; }
.d-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; box-shadow: 0 6px 24px #0003; font-size: 80px; }
.d-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-size: 15px; color: #555; }
.d-notes h3 { margin-top: 26px; font-size: 24px; letter-spacing: -.03em; }
.d-notes p { margin-top: 8px; font-size: 14px; line-height: 1.55; color: #444; white-space: pre-wrap; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.d-title { font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
.d-artist { margin-top: 4px; font-size: 22px; color: var(--accent); cursor: default; }
.d-sub { margin-top: 6px; color: var(--muted); font-size: 15px; }
.d-actions { display: flex; align-items: center; gap: 10px; position: relative; flex: none; }
.pill { padding: 8px 16px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
.pill:hover { background: var(--accent-dark); }
.pill.on { background: #e5f1ff; color: var(--accent); }
.dots { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; letter-spacing: 1px; display: grid; place-items: center; }
.menu { position: absolute; right: 0; top: 46px; z-index: 8; min-width: 210px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 8px 28px #0003; display: none; }
.menu.show { display: block; }
.menu button { display: block; width: 100%; padding: 9px 12px; border-radius: 6px; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--accent); color: #fff; }
.dtable { margin-top: 28px; }
.dhead, .drow { display: grid; grid-template-columns: 46px minmax(0,2fr) minmax(0,1.3fr) 56px 40px; gap: 10px; align-items: center; padding: 0 6px; }
.dhead { height: 30px; color: var(--muted); font-size: 14px; }
.drow { height: 64px; font-size: 15px; cursor: pointer; border-radius: 4px; }
.drow:hover { background: #f3f8ff; } .drow.playing { background: #e3efff; }
.drow .num { color: var(--muted); display: flex; gap: 8px; align-items: center; }
.drow .star { color: #b0b0b6; width: 12px; font-size: 12px; }

/* Studio (página) */
.card { margin-top: 26px; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 2px 10px #0000000a; }
.card h2 { font-size: 22px; letter-spacing: -.03em; margin-bottom: 4px; }
.card .hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; margin-bottom: 6px; color: #555; font-size: 12px; font-weight: 600; }
.field input[type=text], .field select, .field textarea { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid #d2d2d7; border-radius: 8px; background: #fff; font-size: 14px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field input[disabled] { background: var(--surface); color: #666; }
.field textarea { min-height: 84px; resize: vertical; }
.field input[type=file] { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dropzone { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; border: 2px dashed #c7c7cc; border-radius: 12px; background: var(--surface); text-align: center; color: #555; font-size: 14px; cursor: pointer; }
.dropzone.drag { border-color: var(--accent); background: #eaf3ff; }
.dropzone b { color: var(--accent); }
.filelist { margin: 12px 0 16px; display: grid; gap: 8px; }
.fitem { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 13px; }
.fitem input { min-height: 32px; padding: 5px 9px; border: 1px solid #d2d2d7; border-radius: 6px; font-size: 13px; outline: none; }
.fitem .fn { color: var(--muted); font-size: 11px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 18px; border-radius: 9px; font-size: 14px; font-weight: 600; background: var(--accent); color: #fff; }
.btn:hover:not(:disabled) { background: var(--accent-dark); }
.btn.sec { background: var(--surface); color: var(--text); border: 1px solid #d2d2d7; }
.btn.sec:hover:not(:disabled) { background: #ebebef; }
.btn.danger { background: var(--danger); }
.status { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
.status.show { display: block; }
.status.err { background: #ffeceb; color: #b3261e; } .status.info { background: #e8f2ff; color: #124a99; }
.progress { display: none; margin: 12px 0; } .progress.show { display: block; }
.bar { height: 7px; border-radius: 99px; background: #e5e5ea; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.ptext { margin-top: 6px; color: var(--muted); font-size: 12px; }
.studio-promo { display: flex; align-items: center; gap: 22px; }
.studio-promo .mini { flex: none; width: 96px; height: 96px; border-radius: 18px; background: linear-gradient(145deg,#2c2c2e,#000); display: grid; place-items: center; font-size: 42px; }
.studio-promo > div:nth-child(2) { flex: 1; }
.cover-row { display: flex; align-items: center; gap: 12px; }
.cover-prev { width: 56px; height: 56px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; overflow: hidden; flex: none; color: #aaa; font-size: 20px; }
.cover-prev img { width: 100%; height: 100%; object-fit: cover; }

/* Reproductor */
.player { display: grid; grid-template-columns: minmax(180px,1fr) minmax(260px,1.3fr) minmax(120px,1fr); align-items: center; gap: 18px; padding: 8px 18px; border-top: 1px solid var(--line); background: linear-gradient(#fbfbfd, #f0f0f3); }
.now { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cover { width: 56px; height: 56px; flex: none; border-radius: 5px; overflow: hidden; display: grid; place-items: center; background: #d8d8dd; color: #fff; font-size: 22px; box-shadow: 0 1px 4px #0003; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.now-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-sub { margin-top: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.transport { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
.ctl { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #555; font-size: 14px; }
.ctl:hover { color: #000; background: #00000010; }
.ctl.on { color: var(--accent); }
.ctl.play { width: 38px; height: 38px; font-size: 17px; background: #fff; box-shadow: 0 1px 4px #0003; color: #222; }
.seek { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.seek span { width: 34px; text-align: center; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; }
.volume { display: flex; align-items: center; justify-content: flex-end; gap: 8px; color: #777; }
.volume input { max-width: 110px; }

/* Modales */
.modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; background: #0006; backdrop-filter: blur(6px); }
.modal.show { display: flex; }
.modal-card { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 24px 80px #0005; }
.modal-card.small { max-width: 400px; }
.modal .title { font-size: 20px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 16px; }
.dlg-text { margin-bottom: 14px; color: #555; font-size: 14px; line-height: 1.6; } .dlg-text:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; } .actions .btn { flex: 1; min-width: 120px; }
.toast { position: fixed; left: 50%; bottom: 96px; z-index: 90; transform: translateX(-50%); max-width: 90vw; padding: 11px 18px; border-radius: 10px; background: #1d1d1f; color: #fff; font-size: 13px; box-shadow: 0 8px 28px #0004; display: none; }
.toast.show { display: block; }

/* ---------- Studio estilo GarageBand ---------- */
.studio { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: #1c1c1e; color: #f2f2f7; }
.studio.show { display: flex; }
.daw-top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: linear-gradient(#3a3a3c, #2c2c2e); border-bottom: 1px solid #000; flex-wrap: wrap; }
.daw-top .dbtn { padding: 7px 14px; border-radius: 7px; background: #48484a; color: #fff; font-size: 13px; font-weight: 600; }
.daw-top .dbtn:hover { background: #5a5a5c; }
.daw-top .dbtn.go { background: var(--accent); }
.daw-title { flex: 1; min-width: 140px; max-width: 280px; }
.daw-title input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid #555; padding: 4px 2px; color: #fff; font-size: 16px; font-weight: 700; outline: none; }
.daw-transport { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
.tbtn { width: 38px; height: 38px; border-radius: 50%; background: #48484a; color: #fff; font-size: 15px; display: grid; place-items: center; }
.tbtn:hover { background: #5a5a5c; } .tbtn.rec.on { background: var(--danger); } .tbtn.playb { background: var(--accent); }
.daw-time { min-width: 86px; padding: 7px 12px; border-radius: 8px; background: #000; color: #5ee0ff; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; text-align: center; }
.daw-opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aeaeb2; }
.daw-opt input[type=number] { width: 62px; padding: 5px 7px; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; font-size: 13px; }
.daw-bar2 { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #242426; border-bottom: 1px solid #000; font-size: 13px; color: #aeaeb2; flex-wrap: wrap; }
.daw-scroll { flex: 1; overflow: auto; position: relative; background: #151517; }
.daw-content { position: relative; min-height: 100%; }
.rulerrow { display: flex; height: 28px; position: sticky; top: 0; z-index: 5; background: #2c2c2e; border-bottom: 1px solid #000; }
.rulerhead { position: sticky; left: 0; z-index: 6; flex: none; width: 220px; background: #2c2c2e; border-right: 1px solid #000; padding: 6px 12px; font-size: 11px; color: #8e8e93; }
.ruler { position: relative; flex: none; cursor: pointer; }
.tick { position: absolute; top: 0; height: 100%; padding-left: 4px; border-left: 1px solid #555; font-size: 10px; color: #8e8e93; line-height: 28px; pointer-events: none; }
.trow { display: flex; height: 88px; border-bottom: 1px solid #000; }

.tool:hover { background: #5a5a5c; } .tool.on { background: #ff9f0a; color: #000; } .tool.recon { background: var(--danger); }
.thead2 input[type=range] { width: 100%; height: 14px; }
.lane { position: relative; flex: none; background-image: linear-gradient(90deg, #ffffff0d 1px, transparent 1px); background-size: calc(var(--pps) * 1px) 100%; cursor: crosshair; }

.clip:active { cursor: grabbing; }
.clip canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
.clip span { position: absolute; left: 6px; top: 3px; font-size: 10px; color: #fffc; pointer-events: none; }
.drumblock { position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; border-radius: 6px; cursor: pointer; background: repeating-linear-gradient(90deg, #7a4a12 0 calc(var(--bar) * 1px - 2px), #1c1c1e calc(var(--bar) * 1px - 2px) calc(var(--bar) * 1px)); border: 1px solid #ff9f0a88; opacity: .85; display: flex; align-items: center; padding-left: 12px; font-size: 12px; color: #ffd9a0; }

.drum-grid { display: grid; gap: 6px; overflow-x: auto; }

.step { height: 28px; border-radius: 5px; background: #48484a; } .step.q { background: #5a5a5e; } .step.on { background: #ff9f0a; }

@media (max-width: 900px) {
  .page { padding: 0 20px 40px; }
  .banner-text { font-size: 18px; } .banner-logo { font-size: 20px; } .banner { gap: 14px; height: 90px; }

    <div class="cover-row"><div id="albPrev" class="cover-prev">🖼️</div><input id="albCover" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></div>

<script>
/* ============================================================
   UTILIDADES
============================================================ */
const $ = id => document.getElementById(id);
const audio = $("audio");
const enc = encodeURIComponent;

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(props || {})){
    if(v === false || v == null) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else if(k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

let toastTimer;
function toast(msg){
  const b = $("toast"); b.textContent = msg || "Ocurrió un error."; b.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => b.classList.remove("show"), 3200);
}
function formatBytes(n){
  if(!n) return "0 B"; const u = ["B","KB","MB","GB"]; let i = 0, v = n;
  while(v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
}
function formatTime(s){
  if(!isFinite(s) || s < 0) return "0:00";
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}
function extOf(n){ const i = n.lastIndexOf("."); return i >= 0 ? n.slice(i).toLowerCase() : ""; }
const playsOf = t => t.plays ?? t.play_count ?? 0;
const createdOf = t => t.created_at || t.created || 0;
const durOf = t => t.duration ?? t.duration_seconds ?? 0;
function pfpUrl(v){
  if(!v) return "";
  if(v.startsWith("http://") || v.startsWith("https://")) return v;
  return KN_AUTH_API + (v.startsWith("/") ? v : "/" + v);
}

/* ============================================================
   ESTADO / SESIÓN / API
============================================================ */
let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let ME = null;
let exploreTracks = [], libTracks = [], libIds = new Set(), myTracks = [], myAlbums = [];
let maxTrackBytes = DEFAULT_MAX_TRACK_BYTES;
let redirecting = false;

function goAuth(){
  if(redirecting) return; redirecting = true;
  window.location.replace(AUTH_URL + "?redirect=" + encodeURIComponent(window.location.href));
}
function sessionExpired(){ localStorage.removeItem(TOKEN_KEY); TOKEN = ""; goAuth(); }

async function api(route, options = {}){
  let res;
  try{
    res = await fetch(API + route, { ...options, headers: { "Authorization": "Smart-Token " + TOKEN, ...(options.headers || {}) } });
  }catch(e){ console.error(e); throw new Error("No se pudo conectar con Smart-Sound."); }
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ sessionExpired(); const r = new Error("redirect"); r.redirected = true; throw r; }
  if(!res.ok){ const err = new Error((typeof data.detail === "string" && data.detail) || "Ocurrió un error."); err.status = res.status; throw err; }
  return data;
}
function fail(e){ if(!e.redirected) toast(e.message); }

async function loadMe(){
  if(!TOKEN){ goAuth(); return false; }
  try{
    const d = await api("/api/me"); ME = d.user || d;
    if(!ME || !ME.username){ goAuth(); return false; }
    $("me").textContent = "@" + ME.username;
    const src = pfpUrl(ME.pfp || ME.profile_picture);
    if(src){ const img = $("mypfp"); const fallback = img.src; img.onerror = () => { img.onerror = null; img.src = fallback; }; img.src = src; }
    return true;
  }catch(e){ fail(e); return false; }
}
async function loadLimits(){
  try{ const r = await fetch(API + "/api"); const d = await r.json(); if(d && d.max_track_bytes) maxTrackBytes = d.max_track_bytes; }catch(e){}
}
async function loadExplore(){ try{ exploreTracks = (await api("/api/explore/tracks?limit=500")).tracks || []; }catch(e){ exploreTracks = []; fail(e); } }
async function loadLibrary(){
  try{ libTracks = (await api("/api/library")).tracks || []; }catch(e){ libTracks = []; if(!e.redirected && e.status !== 404) toast(e.message); }
  libIds = new Set(libTracks.map(t => t.id));
}
async function loadMine(){ try{ myTracks = (await api("/api/tracks?limit=500&sort=created&order=desc")).tracks || []; }catch(e){ myTracks = []; } }
async function loadAlbums(){ try{ myAlbums = (await api("/api/albums")).albums || []; }catch(e){ myAlbums = []; } }
async function reloadAll(){ await Promise.all([loadExplore(), loadLibrary(), loadMine(), loadAlbums()]); }

/* ---------- Portadas (se piden con el token y se guardan en caché) ---------- */
const coverCache = new Map();
function coverSrc(path){
  if(coverCache.has(path)) return coverCache.get(path);
  const p = fetch(API + path, { headers: { "Authorization": "Smart-Token " + TOKEN } })
    .then(r => { if(!r.ok) throw new Error("x"); return r.blob(); })
    .then(b => URL.createObjectURL(b));
  coverCache.set(path, p); p.catch(() => coverCache.delete(path));
  return p;
}
const coverPath = t => t.cover_url || ("/api/tracks/" + enc(t.id) + "/cover");
function gradFor(seed){
  let n = 0; String(seed || "x").split("").forEach(c => n = (n * 31 + c.charCodeAt(0)) % 360);
  return "linear-gradient(145deg,hsl(" + n + ",58%,58%),hsl(" + ((n + 45) % 360) + ",60%,34%))";
}
function artEl(path, seed, cls){
  const d = h("div", { class: "art " + (cls || "") }, "♫");
  d.style.background = gradFor(seed);
  coverSrc(path).then(src => {
    const i = new Image(); i.alt = ""; i.src = src;
    i.onload = () => { d.textContent = ""; d.style.background = "none"; d.prepend(i); };
  }).catch(() => {});
  return d;
}
const trackArt = (t, cls) => artEl(coverPath(t), t.id || t.title, cls);

/* ============================================================
   NAVEGACIÓN (estilo iTunes: atrás / adelante)
============================================================ */
let hist = [{ v: "explore" }], hi = 0;
function go(v, arg, replace){
  if(replace) hist[hi] = { v, arg };
  else { hist.splice(hi + 1); hist.push({ v, arg }); hi = hist.length - 1; }
  render();
}
$("backBtn").onclick = () => { if(hi > 0){ hi--; render(); } };
$("fwdBtn").onclick = () => { if(hi < hist.length - 1){ hi++; render(); } };
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { $("search").value = ""; go(b.dataset.tab); });

function render(){
  const { v, arg } = hist[hi];
  const tab = ["library", "explore", "studio"].includes(v) ? v : (v === "detail" || v === "list" ? "explore" : "");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("backBtn").disabled = hi <= 0; $("fwdBtn").disabled = hi >= hist.length - 1;
  const main = $("main"); main.replaceChildren();
  ({ explore: viewExplore, library: viewLibrary, studio: viewStudio, detail: viewDetail, list: viewList })[v](main, arg);
  main.scrollTop = 0; markPlaying(); refreshLibButtons();
}
function findTrack(id){ return [...exploreTracks, ...libTracks, ...myTracks].find(t => t.id === id); }

/* ============================================================
   BIBLIOTECA (añadir / quitar)
============================================================ */
async function toggleLib(t){
  try{
    if(libIds.has(t.id)){
      await api("/api/library/" + enc(t.id), { method: "DELETE" });
      libIds.delete(t.id); libTracks = libTracks.filter(x => x.id !== t.id); toast("Quitada de tu biblioteca.");
    }else{
      await api("/api/library/" + enc(t.id), { method: "POST" });
      libIds.add(t.id); libTracks.push(t); toast("Añadida a tu biblioteca.");
    }
    if(hist[hi].v === "library") render(); else refreshLibButtons();
  }catch(e){ fail(e); }
}
async function addMany(list){
  const all = list.every(t => libIds.has(t.id));
  try{
    for(const t of list){
      if(all){ await api("/api/library/" + enc(t.id), { method: "DELETE" }); libIds.delete(t.id); libTracks = libTracks.filter(x => x.id !== t.id); }
      else if(!libIds.has(t.id)){ await api("/api/library/" + enc(t.id), { method: "POST" }); libIds.add(t.id); libTracks.push(t); }
    }
    toast(all ? "Quitadas de tu biblioteca." : "Añadidas a tu biblioteca."); refreshLibButtons();
  }catch(e){ fail(e); }
}
function refreshLibButtons(){
  document.querySelectorAll(".libbtn").forEach(b => { const on = libIds.has(b.dataset.tid); b.textContent = on ? "✓" : "＋"; b.title = on ? "En tu biblioteca (clic para quitar)" : "Añadir a la biblioteca"; });
  document.querySelectorAll(".libpill").forEach(b => {
    const ids = b.dataset.tids.split(","); const on = ids.every(i => libIds.has(i));
    b.textContent = on ? "✓ En tu biblioteca" : "＋ Añadir a la biblioteca"; b.classList.toggle("on", on);
  });
}
function markPlaying(){
  document.querySelectorAll("[data-tid]").forEach(e => { if(e.classList.contains("row") || e.classList.contains("drow")) e.classList.toggle("playing", !!currentTrack && e.dataset.tid === currentTrack.id); });
}

/* ============================================================
   VISTA: EXPLORAR
============================================================ */
function carousel(items){
  const tr = h("div", { class: "car-track" }, items);
  const mk = (cls, txt, dir) => h("button", { class: "car-btn " + cls, type: "button", "aria-label": dir < 0 ? "Anterior" : "Siguiente", onclick: () => tr.scrollBy({ left: dir * tr.clientWidth * 0.9, behavior: "smooth" }) }, txt);
  return h("div", { class: "car" }, mk("l", "‹", -1), tr, mk("r", "›", 1));
}
function playFab(t, list){ return h("button", { class: "playfab", type: "button", title: "Reproducir", onclick: e => { e.stopPropagation(); playTrack(t, list); } }, "▶"); }

function viewExplore(main){
  const now = Date.now() / 1000;
  main.append(h("div", { class: "banner", onclick: () => go("studio") },
    h("div", { class: "banner-logo", text: "♫ SMART-SOUND" }), h("div", { class: "banner-text", text: "Sube tu música y publícala gratis ›" })));
  const page = h("div", { class: "page" }); main.append(page);
  page.append(h("h1", { class: "page-title", text: "Explorar" }), h("div", { class: "rule" }));

  if(!exploreTracks.length){
    page.append(h("div", { class: "empty" }, "Todavía no hay música publicada.", h("button", { class: "btn", type: "button", onclick: () => go("studio") }, "Publica la primera canción en Studio")));
    return;
  }

  // 1. Canciones destacadas (portada, título y autor)
  const top = [...exploreTracks].sort((a, b) => playsOf(b) - playsOf(a) || createdOf(b) - createdOf(a)).slice(0, 12);
  page.append(carousel(top.map(t => {
    const isNew = now - createdOf(t) < 5 * 86400;

/* ============================================================
   REPRODUCTOR
============================================================ */
let currentTrack = null, queue = [], playToken = 0, retriedTicket = false, shuffle = false, repeat = "off", seeking = false;

async function playTrack(track, list, forceShuffle){
  if(list) queue = list;
  if(forceShuffle) shuffle = true;
  const my = ++playToken;
  try{
    const data = await api("/api/tracks/" + enc(track.id) + "/playback-ticket", { method: "POST" });
    if(my !== playToken) return;
    const resumeAt = arguments[3] || 0;
    currentTrack = track; audio.src = API + data.stream_url;
    if(resumeAt > 0) audio.addEventListener("loadedmetadata", () => { audio.currentTime = resumeAt; }, { once: true });
    await audio.play().catch(() => toast("El navegador bloqueó la reproducción. Pulsa ▶."));
    showNow(track, data.cover_url ? API + data.cover_url : "");
    markPlaying(); refreshPlayButtons();
    if(!resumeAt) api("/api/tracks/" + enc(track.id) + "/play", { method: "POST" }).catch(() => {});
  }catch(e){ fail(e); }
}
function showNow(t, coverUrl){
  $("nowTitle").textContent = t.title;
  $("nowSub").textContent = [t.artist, t.album].filter(Boolean).join(" · ") || "Artista desconocido";
  const c = $("cover"); c.replaceChildren(); c.textContent = "♫";
  coverSrc(coverPath(t)).then(src => { if(currentTrack !== t) return; const i = new Image(); i.alt = "Portada"; i.src = src; i.onload = () => { c.textContent = ""; c.append(i); }; }).catch(() => {
    if(coverUrl){ const i = new Image(); i.src = coverUrl; i.onload = () => { c.textContent = ""; c.append(i); }; }
  });
  document.title = t.title + " · Smart-Sound";
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || "", album: t.album || "", artwork: coverUrl ? [{ src: coverUrl }] : [] });
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("previoustrack", playPrevious);
      navigator.mediaSession.setActionHandler("nexttrack", () => playNext(true));
    }catch(e){}
  }
}
function clearNow(){
  currentTrack = null; playToken++; audio.pause(); audio.removeAttribute("src"); audio.load();
  $("nowTitle").textContent = "Elige una canción"; $("nowSub").textContent = "Smart-Sound"; $("cover").replaceChildren(); $("cover").textContent = "♫";
  $("seekBar").value = 0; $("curTime").textContent = "0:00"; $("durTime").textContent = "0:00"; document.title = "Smart-Sound"; markPlaying(); refreshPlayButtons();
}
function togglePlay(){
  if(!currentTrack){ const l = exploreTracks; if(l.length) playTrack(l[0], l); return; }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}
const curIdx = () => currentTrack ? queue.findIndex(t => t.id === currentTrack.id) : -1;
function playNext(manual){
  if(!queue.length) return; const i = curIdx();
  if(shuffle && queue.length > 1){ let n; do{ n = Math.floor(Math.random() * queue.length); }while(n === i); playTrack(queue[n]); return; }
  if(i < queue.length - 1){ playTrack(queue[i + 1]); return; }
  if(repeat === "all" || manual){ playTrack(queue[0]); return; }
  audio.pause(); audio.currentTime = 0;
}
function playPrevious(){
  if(!queue.length) return;
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  const i = curIdx(); playTrack(queue[i > 0 ? i - 1 : queue.length - 1]);
}
function refreshPlayButtons(){
  $("playBtn").textContent = audio.paused ? "▶" : "⏸";
  $("shuffleBtn").classList.toggle("on", shuffle);
  const r = $("repeatBtn"); r.classList.toggle("on", repeat !== "off"); r.textContent = repeat === "one" ? "🔂" : "🔁";
  r.title = repeat === "off" ? "Repetir: no" : repeat === "all" ? "Repetir: toda la lista" : "Repetir: esta canción";
}
audio.addEventListener("play", refreshPlayButtons);
audio.addEventListener("pause", refreshPlayButtons);
audio.addEventListener("loadedmetadata", () => { $("durTime").textContent = formatTime(audio.duration); });
audio.addEventListener("timeupdate", () => {
  $("curTime").textContent = formatTime(audio.currentTime);
  if(!seeking && audio.duration) $("seekBar").value = (audio.currentTime / audio.duration) * 1000;
});
audio.addEventListener("ended", () => { if(repeat === "one"){ audio.currentTime = 0; audio.play().catch(() => {}); return; } playNext(false); });
audio.addEventListener("error", () => {
  if(!currentTrack || retriedTicket) return; retriedTicket = true;
  playTrack(currentTrack, null, false, audio.currentTime || 0).finally(() => { retriedTicket = false; });
});
$("playBtn").onclick = togglePlay;
$("nextBtn").onclick = () => playNext(true);
$("prevBtn").onclick = playPrevious;
$("shuffleBtn").onclick = () => { shuffle = !shuffle; refreshPlayButtons(); };
$("repeatBtn").onclick = () => { repeat = repeat === "off" ? "all" : repeat === "all" ? "one" : "off"; refreshPlayButtons(); };
$("seekBar").addEventListener("input", () => { seeking = true; if(audio.duration) $("curTime").textContent = formatTime((Number($("seekBar").value) / 1000) * audio.duration); });
$("seekBar").addEventListener("change", () => { if(audio.duration) audio.currentTime = (Number($("seekBar").value) / 1000) * audio.duration; seeking = false; });

/* ---------- Subida (XHR con progreso) ---------- */
function uploadTrack(o, onProgress, onSaving){
  return new Promise((resolve, reject) => {
    if(o.file.size > maxTrackBytes) return reject(new Error("El audio supera el límite de " + formatBytes(maxTrackBytes) + "."));
    const form = new FormData();
    form.append("file", o.file); form.append("title", o.title); form.append("artist", ME.username);
    form.append("album", o.album || ""); form.append("album_id", o.album_id || ""); form.append("genre", o.genre || "");
    form.append("description", o.description || ""); form.append("published", "1");
    if(o.cover) form.append("cover", o.cover);
    const xhr = new XMLHttpRequest(); uploadXhr = xhr;
    xhr.open("POST", API + "/api/tracks/upload"); xhr.setRequestHeader("Authorization", "Smart-Token " + TOKEN);
    xhr.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(e.loaded, e.total); };
    xhr.upload.onload = () => onSaving && onSaving();
    xhr.onload = () => {
      uploadXhr = null; let d = {}; try{ d = JSON.parse(xhr.responseText || "{}"); }catch(e){}
      if(xhr.status === 401){ sessionExpired(); const r = new Error("redirect"); r.redirected = true; return reject(r); }
      if(xhr.status >= 200 && xhr.status < 300) return resolve(d);
      reject(new Error((typeof d.detail === "string" && d.detail) || "No se pudo subir la canción."));
    };
    xhr.onerror = () => { uploadXhr = null; reject(new Error("Se perdió la conexión al subir.")); };
    xhr.onabort = () => { uploadXhr = null; reject(new Error("Subida cancelada.")); };
    xhr.send(form);
  });
}
window.addEventListener("beforeunload", e => { if(uploadXhr){ e.preventDefault(); e.returnValue = ""; } });

/* ============================================================
   STUDIO TIPO GARAGEBAND (simple)
============================================================ */
const DR = ["kick", "snare", "hat", "clap"];
const DR_NAMES = { kick: "Bombo", snare: "Caja", hat: "Hi-hat", clap: "Aplauso" };
const D = { tracks: [], bpm: 100, bars: 8, pos: 0, playing: false, ctx: null, startAt: 0, startPos: 0, raf: 0, recording: null, selected: null, pps: 40, gains: [], dirty: false, drumTrack: null };
let uidN = 0; const uid = () => "t" + (++uidN);

function newDrumTrack(){
  const p = {}; DR.forEach(r => p[r] = Array(16).fill(0));
  [0, 4, 8, 12].forEach(i => p.kick[i] = 1); [4, 12].forEach(i => p.snare[i] = 1); [0, 2, 4, 6, 8, 10, 12, 14].forEach(i => p.hat[i] = 1);
  return { id: uid(), type: "drums", name: "Batería", vol: 0.8, mute: false, clips: [], pattern: p };
}
const newAudioTrack = n => ({ id: uid(), type: "audio", name: "Audio " + n, vol: 1, mute: false, clips: [] });
const barSec = () => (60 / D.bpm) * 4;
function projDur(){
  let end = 0; D.tracks.forEach(t => t.clips.forEach(c => end = Math.max(end, c.start + c.buffer.duration)));
  return Math.max(D.bars * barSec(), end, 1);
}
const laneW = () => Math.max(projDur() + 6, 30) * D.pps;
const hasContent = () => D.tracks.some(t => t.clips.length || (t.type === "drums" && DR.some(r => t.pattern[r].some(Boolean))));

function openStudio(){
  Object.assign(D, { tracks: [newDrumTrack(), newAudioTrack(1)], bpm: 100, bars: 8, pos: 0, playing: false, selected: null, dirty: false, drumTrack: null });
  D.selected = D.tracks[1].id;
  $("dawName").value = "Mi canción"; $("dawBpm").value = 100; $("dawBars").value = 8; $("drumPanel").classList.remove("show");
  $("studio").classList.add("show"); renderTracks(); updateTime();
}
async function closeStudio(force){
  if(!force && hasContent() && D.dirty && !await askDialog({ title: "¿Cerrar el Studio?", text: "Se perderá el proyecto actual si no lo publicas o exportas.", ok: "Cerrar", danger: true })) return;
  stopPlayback(); if(D.recording) recStop(); $("studio").classList.remove("show"); $("finishModal").classList.remove("show");
}

/* ---------- Dibujo de pistas ---------- */
function drawWave(canvas, buf){
  const w = Math.max(1, Math.min(32000, Math.floor(buf.duration * D.pps))); canvas.width = w; canvas.height = 76;
  const g = canvas.getContext("2d"); const data = buf.getChannelData(0); const step = Math.max(1, Math.floor(data.length / w));
  g.fillStyle = "#b8ffd9"; const mid = 38;
  for(let x = 0; x < w; x++){
    let mx = 0; const s = x * step; for(let i = 0; i < step; i += Math.ceil(step / 40)) mx = Math.max(mx, Math.abs(data[s + i] || 0));
    const hh = Math.max(1, mx * 34); g.fillRect(x, mid - hh, 1, hh * 2);
  }
}
function renderTracks(){
  const lw = laneW(); const content = $("dawContent");
  content.style.width = (220 + lw) + "px"; content.style.setProperty("--pps", D.pps);
  const ruler = $("dawRuler"); ruler.style.width = lw + "px"; ruler.replaceChildren();
  for(let s = 0; s < lw / D.pps; s += 5){ const t = h("div", { class: "tick", text: formatTime(s) }); t.style.left = (s * D.pps) + "px"; ruler.append(t); }
  const rows = $("dawRows"); rows.replaceChildren();
  D.tracks.forEach(tr => {
    const name = h("input", { class: "nm", value: tr.name, maxlength: "30", "aria-label": "Nombre de la pista" });
    name.oninput = () => { tr.name = name.value; D.dirty = true; };
    name.onfocus = () => selectTrack(tr.id);
    const tools = h("div", { class: "tools" });
    const tool = (txt, title, cls, fn) => h("button", { class: "tool " + (cls || ""), type: "button", title, onclick: e => { e.stopPropagation(); fn(); } }, txt);
    if(tr.type === "audio"){
      tools.append(tool("●", D.recording && D.recording.tr === tr ? "Detener grabación" : "Grabar", D.recording && D.recording.tr === tr ? "recon" : "", () => { selectTrack(tr.id); recToggle(); }),
        tool("⤒", "Importar audio", "", () => { D.importTo = tr; $("dawFile").click(); }));
    }else tools.append(tool("▦ Patrón", "Editar patrón", "", () => openDrumPanel(tr)));
    tools.append(tool("M", "Silenciar", tr.mute ? "on" : "", () => { tr.mute = !tr.mute; if(D.gains) D.gains.forEach(([t, g]) => { if(t === tr) g.gain.value = tr.mute ? 0 : tr.vol; }); renderTracks(); }),
      tool("✕", "Eliminar pista", "", () => { if(D.recording && D.recording.tr === tr) return; D.tracks = D.tracks.filter(t => t !== tr); if(D.selected === tr.id) D.selected = null; D.dirty = true; renderTracks(); }));
    const vol = h("input", { type: "range", min: "0", max: "100", value: String(Math.round(tr.vol * 100)), "aria-label": "Volumen de la pista" });
    vol.oninput = () => { tr.vol = vol.value / 100; if(D.gains) D.gains.forEach(([t, g]) => { if(t === tr && !tr.mute) g.gain.value = tr.vol; }); };
    const head = h("div", { class: "thead2", style: D.selected === tr.id ? "background:#38383c" : "", onclick: () => selectTrack(tr.id) }, name, tools, vol);

    const lane = h("div", { class: "lane", style: "width:" + lw + "px" });
    lane.onclick = e => { if(e.target !== lane && !e.target.classList.contains("drumblock")) return; seekTo((e.clientX - lane.getBoundingClientRect().left) / D.pps); selectTrack(tr.id); };
    if(tr.type === "drums"){
      const blk = h("div", { class: "drumblock", text: "Patrón de 16 pasos · se repite en todo el proyecto" });
      blk.style.setProperty("--bar", barSec() * D.pps); blk.style.right = "auto"; blk.style.width = (projDur() * D.pps) + "px";
      blk.onclick = e => { e.stopPropagation(); selectTrack(tr.id); openDrumPanel(tr); };
      lane.append(blk);
    }else tr.clips.forEach(c => {
      const cv = document.createElement("canvas"); drawWave(cv, c.buffer);
      const el = h("div", { class: "clip", title: "Arrastra para mover · doble clic para borrar" }, cv, h("span", { text: c.name || "Clip" }));
      el.style.left = (c.start * D.pps) + "px"; el.style.width = (c.buffer.duration * D.pps) + "px";
      el.ondblclick = () => { tr.clips = tr.clips.filter(x => x !== c); D.dirty = true; renderTracks(); };
      el.onpointerdown = e => {
        e.preventDefault(); selectTrack(tr.id, true); el.setPointerCapture(e.pointerId); const sx = e.clientX, s0 = c.start;
        el.onpointermove = ev => { c.start = Math.max(0, s0 + (ev.clientX - sx) / D.pps); el.style.left = (c.start * D.pps) + "px"; };
        el.onpointerup = () => { el.onpointermove = el.onpointerup = null; D.dirty = true; if(D.playing){ const p = D.pos; stopPlayback(); D.pos = p; startPlayback(); } };
      };
      lane.append(el);
    });
    rows.append(h("div", { class: "trow" }, head, lane));
  });
  movePlayhead();
}
function selectTrack(id, noRender){
  if(D.selected === id) return; D.selected = id;
  if(!noRender) renderTracks();
}

/* ---------- Editor de patrón de batería ---------- */
function openDrumPanel(tr){
  D.drumTrack = tr; $("drumTitle").textContent = "Patrón de batería · " + tr.name + " (16 pasos = 1 compás)";
  const grid = $("drumGrid"); grid.replaceChildren();
  DR.forEach(r => {
    const row = h("div", { class: "drum-row" }, h("b", { text: DR_NAMES[r] }));
    tr.pattern[r].forEach((v, i) => {
      const st = h("button", { class: "step" + (v ? " on" : "") + (i % 4 === 0 ? " q" : ""), type: "button", "aria-label": DR_NAMES[r] + " paso " + (i + 1) });
      st.onclick = () => { tr.pattern[r][i] = tr.pattern[r][i] ? 0 : 1; st.classList.toggle("on", !!tr.pattern[r][i]); D.dirty = true; if(tr.pattern[r][i] && !D.playing) previewHit(r); if(D.playing){ const p = D.pos; stopPlayback(); D.pos = p; startPlayback(); } };
      row.append(st);
    });
    grid.append(row);
  });
  $("drumPanel").classList.add("show");
}
$("drumClose").onclick = () => $("drumPanel").classList.remove("show");
function previewHit(r){
  const c = new (window.AudioContext || window.webkitAudioContext)(); const m = c.createGain(); m.gain.value = .8; m.connect(c.destination);
  drumHit(c, m, r, c.currentTime + .01, noiseBuf(c)); setTimeout(() => c.close(), 800);
}

/* ---------- Sonido de la batería (sintetizada) ---------- */
function noiseBuf(ctx){
  const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate), d = b.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b;
}
function drumHit(ctx, out, type, t, noise){
  const g = ctx.createGain(); g.connect(out);
  if(type === "kick"){
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .32); o.connect(g); o.start(t); o.stop(t + .35); return;
  }
  const mk = (ft, freq, vol, dec, at) => {
    const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = ft; f.frequency.value = freq;
    const gg = ctx.createGain(); gg.gain.setValueAtTime(vol, at); gg.gain.exponentialRampToValueAtTime(.001, at + dec);
    s.connect(f); f.connect(gg); gg.connect(out); s.start(at, Math.random() * .2); s.stop(at + dec + .02);
  };
  if(type === "snare"){ mk("highpass", 1200, .7, .2, t); const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(120, t + .1); const og = ctx.createGain(); og.gain.setValueAtTime(.5, t); og.gain.exponentialRampToValueAtTime(.001, t + .12); o.connect(og); og.connect(out); o.start(t); o.stop(t + .14); }
  else if(type === "hat") mk("highpass", 7000, .35, .06, t);
  else if(type === "clap"){ [0, .012, .026].forEach(d => mk("bandpass", 1500, .6, .09, t + d)); }
}

/* ---------- Motor de reproducción / exportación ---------- */
function scheduleAll(ctx, out, from, t0, live){
  const gains = []; const dur = projDur(); const noise = noiseBuf(ctx);
  D.tracks.forEach(tr => {
    const g = ctx.createGain(); g.gain.value = tr.mute ? 0 : tr.vol; g.connect(out); gains.push([tr, g]);
    if(tr.type === "audio"){
      tr.clips.forEach(c => {
        if(c.start + c.buffer.duration <= from) return;
        const s = ctx.createBufferSource(); s.buffer = c.buffer; s.connect(g);
        s.start(t0 + Math.max(0, c.start - from), Math.max(0, from - c.start));
      });
    }else{
      const sd = 60 / D.bpm / 4, steps = Math.ceil(dur / sd);
      for(let s = 0; s < steps; s++){
        const tm = s * sd; if(tm < from - 1e-6) continue;
        DR.forEach(r => { if(tr.pattern[r][s % 16]) drumHit(ctx, g, r, t0 + tm - from, noise); });
      }
    }
  });
  return gains;
}
function startPlayback(){
  if(D.playing) return; if(!audio.paused) audio.pause();
  const ctx = new (window.AudioContext || window.webkitAudioContext)(); D.ctx = ctx;
  const master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
  D.startAt = ctx.currentTime + .05; D.startPos = D.pos; D.gains = scheduleAll(ctx, master, D.pos, D.startAt, true);
  D.playing = true; $("dawPlay").textContent = "⏸"; dawLoop();
}
function dawLoop(){
  if(!D.playing) return;
  D.pos = D.startPos + Math.max(0, D.ctx.currentTime - D.startAt);
  if(!D.recording && D.pos >= projDur()){ stopPlayback(); D.pos = 0; movePlayhead(); updateTime(); return; }
  movePlayhead(); updateTime();
  const sc = $("dawScroll"), x = 220 + D.pos * D.pps;
  if(x > sc.scrollLeft + sc.clientWidth - 40) sc.scrollLeft = x - 260;
  D.raf = requestAnimationFrame(dawLoop);
}
function stopPlayback(){
  cancelAnimationFrame(D.raf); if(D.ctx){ try{ D.ctx.close(); }catch(e){} D.ctx = null; }
  D.playing = false; D.gains = []; $("dawPlay").textContent = "▶";
}
function seekTo(sec){
  const was = D.playing; stopPlayback(); D.pos = Math.max(0, sec); movePlayhead(); updateTime(); if(was) startPlayback();
}
function movePlayhead(){ $("playhead").style.left = (220 + D.pos * D.pps) + "px"; }
function updateTime(){ const m = Math.floor(D.pos / 60), s = D.pos % 60; $("dawTime").textContent = m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }
$("dawPlay").onclick = () => { D.playing ? (D.recording ? recStop() : stopPlayback()) : startPlayback(); };
$("dawRew").onclick = () => seekTo(0);
$("dawRec").onclick = recToggle;
$("dawBpm").onchange = () => { D.bpm = Math.min(220, Math.max(50, Number($("dawBpm").value) || 100)); $("dawBpm").value = D.bpm; D.dirty = true; if(D.playing) seekTo(D.pos); renderTracks(); };
$("dawBars").onchange = () => { D.bars = Math.min(64, Math.max(1, Number($("dawBars").value) || 8)); $("dawBars").value = D.bars; D.dirty = true; if(D.playing) seekTo(D.pos); renderTracks(); };
$("dawName").oninput = () => { D.dirty = true; };
$("dawRuler").onclick = e => seekTo((e.clientX - $("dawRuler").getBoundingClientRect().left) / D.pps);
$("addAudio").onclick = () => { const n = D.tracks.filter(t => t.type === "audio").length + 1; const t = newAudioTrack(n); D.tracks.push(t); D.selected = t.id; D.dirty = true; renderTracks(); };
$("addDrums").onclick = () => { const t = newDrumTrack(); t.name = "Batería " + (D.tracks.filter(x => x.type === "drums").length + 1); D.tracks.push(t); D.dirty = true; renderTracks(); };
$("dawClose").onclick = () => closeStudio(false);

/* ---------- Grabar / importar ---------- */
async function decodeBlob(blob){
  const ab = await blob.arrayBuffer(); const c = new (window.AudioContext || window.webkitAudioContext)();
  try{ return await c.decodeAudioData(ab); } finally { c.close(); }
}
function recToggle(){
  if(D.recording){ recStop(); return; }
  const tr = D.tracks.find(t => t.id === D.selected && t.type === "audio") || D.tracks.find(t => t.type === "audio");
  if(!tr){ toast("Añade una pista de audio para grabar."); return; }
  recStart(tr);
}
async function recStart(tr){
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }catch(e){ toast("No se pudo acceder al micrófono. Revisa los permisos del navegador."); return; }
  const mr = new MediaRecorder(stream), chunks = [], startPos = D.pos;
  mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    try{ const buf = await decodeBlob(new Blob(chunks, { type: mr.mimeType })); tr.clips.push({ id: uid(), buffer: buf, start: startPos, name: "Grabación" }); D.dirty = true; }
    catch(e){ toast("No se pudo procesar la grabación."); }
    D.recording = null; $("dawRec").classList.remove("on"); renderTracks();
  };
  D.recording = { mr, tr }; D.selected = tr.id; mr.start(); $("dawRec").classList.add("on");
  if(!D.playing) startPlayback(); renderTracks();
}
function recStop(){
  if(!D.recording) return; try{ D.recording.mr.stop(); }catch(e){}
  stopPlayback();
}
$("dawFile").onchange = async () => {
  const f = $("dawFile").files[0]; $("dawFile").value = ""; if(!f || !D.importTo) return;
  try{ const buf = await decodeBlob(f); D.importTo.clips.push({ id: uid(), buffer: buf, start: D.pos, name: f.name.replace(/\.[^.]+$/, "") }); D.dirty = true; renderTracks(); }
  catch(e){ toast("No se pudo leer ese audio."); }
};
document.addEventListener("keydown", e => {
  if(!$("studio").classList.contains("show") || $("finishModal").classList.contains("show")) return;
  if(e.code === "Space" && !["input", "textarea", "select", "button"].includes((document.activeElement?.tagName || "").toLowerCase())){ e.preventDefault(); $("dawPlay").click(); }
});

/* ---------- Terminar → exportar .mp3 / publicar ---------- */
$("dawFinish").onclick = () => {
  if(D.recording) recStop();
  if(!hasContent()){ toast("Tu proyecto está vacío. Graba, importa audio o activa pasos de batería."); return; }
  stopPlayback();
  $("finName").value = $("dawName").value.trim() || "Mi canción"; $("finArtist").value = ME.username;
  bindAlbumSelect($("finAlbum")); fillGenres($("finGenre")); $("finDesc").value = "";
  setStatus("finStatus", ""); $("finProgress").classList.remove("show"); $("finishModal").classList.add("show");
};
$("finBack").onclick = () => $("finishModal").classList.remove("show");

async function renderMix(){
  const dur = projDur() + .5, sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  const master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
  scheduleAll(ctx, master, 0, 0, false);
  return ctx.startRendering();
}
function toMp3(buf){
  if(!window.lamejs) throw new Error("No se pudo cargar el codificador MP3 (revisa tu conexión).");
  const enc = new lamejs.Mp3Encoder(2, buf.sampleRate, 128);
  const conv = a => { const o = new Int16Array(a.length); for(let i = 0; i < a.length; i++){ const s = Math.max(-1, Math.min(1, a[i])); o[i] = s < 0 ? s * 32768 : s * 32767; } return o; };
  const L = conv(buf.getChannelData(0)), R = conv(buf.numberOfChannels > 1 ? buf.getChannelData(1) : buf.getChannelData(0));
  const out = [], bs = 1152;
  for(let i = 0; i < L.length; i += bs){ const b = enc.encodeBuffer(L.subarray(i, i + bs), R.subarray(i, i + bs)); if(b.length) out.push(new Uint8Array(b)); }
  const e = enc.flush(); if(e.length) out.push(new Uint8Array(e));
  return new Blob(out, { type: "audio/mpeg" });
}
async function buildMp3(){
  $("finProgress").classList.add("show"); $("finBar").style.width = "30%"; $("finPText").textContent = "Mezclando pistas…";
  await new Promise(r => setTimeout(r, 30));
  const buf = await renderMix(); $("finBar").style.width = "65%"; $("finPText").textContent = "Convirtiendo a MP3…";
  await new Promise(r => setTimeout(r, 30));
  const blob = toMp3(buf); $("finBar").style.width = "100%"; return blob;
}
const safeName = n => (n || "cancion").replace(/[\\/:*?"<>|]+/g, "").trim() || "cancion";

$("finExport").onclick = async () => {
  const name = $("finName").value.trim(); if(!name){ setStatus("finStatus", "Ponle un nombre a la canción.", "err"); return; }
  setStatus("finStatus", ""); const btns = [$("finExport"), $("finPublish")]; btns.forEach(b => b.disabled = true);
  try{
    const blob = await buildMp3(); const url = URL.createObjectURL(blob);
    const a = h("a", { href: url, download: safeName(name) + ".mp3" }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
    $("finPText").textContent = "Listo: " + safeName(name) + ".mp3 (" + formatBytes(blob.size) + ")";
  }catch(e){ setStatus("finStatus", e.message, "err"); $("finProgress").classList.remove("show"); }
  finally{ btns.forEach(b => b.disabled = false); }
};
$("finPublish").onclick = async () => {
  const name = $("finName").value.trim(); if(!name){ setStatus("finStatus", "Ponle un nombre a la canción.", "err"); return; }
  if(!$("finGenre").value){ setStatus("finStatus", "Elige un género.", "err"); return; }
  setStatus("finStatus", ""); const btns = [$("finExport"), $("finPublish")]; btns.forEach(b => b.disabled = true);
  try{
    const blob = await buildMp3(); const file = new File([blob], safeName(name) + ".mp3", { type: "audio/mpeg" }); const alb = albumById($("finAlbum").value);
    await uploadTrack({ file, title: name, album: alb ? alb.name : "", album_id: alb ? alb.id : "", genre: $("finGenre").value, description: $("finDesc").value.trim() },
      (l, t) => { $("finBar").style.width = Math.floor((l / t) * 100) + "%"; $("finPText").textContent = "Publicando… " + Math.floor((l / t) * 100) + "%"; },
      () => { $("finPText").textContent = "Revisando y guardando…"; });
    toast("¡Canción publicada!"); D.dirty = false; await closeStudio(true); await Promise.all([loadExplore(), loadMine()]); go("explore");
  }catch(e){ if(!e.redirected){ setStatus("finStatus", e.message, "err"); $("finProgress").classList.remove("show"); } }
  finally{ btns.forEach(b => b.disabled = false); }
};

$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = $("search").value.trim();
    if(q) go("list", { kind: "search", q }, hist[hi].v === "list" && hist[hi].arg && hist[hi].arg.kind === "search");
    else if(hist[hi].v === "list" && hist[hi].arg.kind === "search") go("explore", null, true);
  }, SEARCH_DELAY_MS);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if($("dialog").classList.contains("show")){ $("dlgCancel").click(); return; }
    if($("albumModal").classList.contains("show")){ closeAlbumModal(true); return; }
    if($("finishModal").classList.contains("show")){ $("finishModal").classList.remove("show"); return; }
    if($("editModal").classList.contains("show")){ closeEdit(); return; }
    return;
  }
  if(e.code === "Space" && !$("studio").classList.contains("show")){
    const tag = (document.activeElement?.tagName || "").toLowerCase();
    if(!["input", "textarea", "select", "button"].includes(tag) && !document.querySelector(".modal.show")){ e.preventDefault(); togglePlay(); }
  }
});
$("editModal").addEventListener("click", e => { if(e.target.id === "editModal") closeEdit(); });

async function logout(){
  try{ await fetch(API + "/api/logout", { method: "POST", headers: { "Authorization": "Smart-Token " + TOKEN } }); }catch(e){}
  localStorage.removeItem(TOKEN_KEY); TOKEN = ""; goAuth();
}
